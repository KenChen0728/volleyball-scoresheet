<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12324F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="排球記錄表">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>排球電子記錄表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面概念：整頁固定一個畫面不上下滑。手機用底部分頁，平板用側邊分頁，細節用浮動面板。
   系統字型為刻意選擇：比賽現場可能沒有網路，不能依賴線上字型。 */
:root{
  --bg:#EEF3F2; --panel:#FFFFFF; --ink:#12201F; --muted:#566664; --line:#CBD6D4; --soft:#E1E9E7;
  --t1:#0A5AA8; --t1-soft:#DCEAF7; --t1-on:#FFFFFF; --t2:#B8420B; --t2-soft:#FBE6DA; --t2-on:#FFFFFF;
  --ok:#14703F; --ok-soft:#DBF1E3; --warn:#9A5B00; --warn-soft:#FBEFD5; --bad:#B3261E; --bad-soft:#FBE4E2;
  --on-accent:#FFFFFF; --scrim:rgba(10,20,19,.45); --del:#A3211A; --del-on:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1716; --panel:#172322; --ink:#E8F0EE; --muted:#9DB0AD; --line:#2F403E; --soft:#223130;
  --t1:#6FB3F2; --t1-soft:#17324B; --t2:#F59A63; --t2-soft:#44260F;
  --ok:#62D08F; --ok-soft:#143524; --warn:#EDB95E; --warn-soft:#3C2C0D; --bad:#F2918A; --bad-soft:#47201D;
  --on-accent:#0B1413; --scrim:rgba(0,0,0,.6); --del:#8E2A24; --del-on:#FFE3E0; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1716; --panel:#172322; --ink:#E8F0EE; --muted:#9DB0AD; --line:#2F403E; --soft:#223130;
  --t1:#6FB3F2; --t1-soft:#17324B; --t2:#F59A63; --t2-soft:#44260F;
  --ok:#62D08F; --ok-soft:#143524; --warn:#EDB95E; --warn-soft:#3C2C0D; --bad:#F2918A; --bad-soft:#47201D;
  --on-accent:#0B1413; --scrim:rgba(0,0,0,.6); --del:#8E2A24; --del-on:#FFE3E0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);font-variant-numeric:tabular-nums;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:1200px;margin:0 auto}
h1,h2,h3,p,ul{margin:0;padding:0}
h1{font-size:18px}
h2{font-size:17px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);min-height:46px;padding:0 12px;font-weight:600}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
input{width:100%;min-height:46px;padding:0 10px;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
input:disabled{background:var(--soft);color:var(--muted)}
input[type="date"],input[type="time"]{-webkit-appearance:none;appearance:none;display:flex;align-items:center;height:46px;line-height:44px;padding-top:0;padding-bottom:0;min-width:0;max-width:100%;text-align:left}
input::-webkit-date-and-time-value{text-align:left;line-height:44px;min-height:44px;margin:0;padding:0}
.fields>label{overflow:hidden}
label{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--muted);min-width:0}
.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.go{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.danger,.pad button.back,.bench .chip.blank.clear,.chip.blank.clear,button.danger{background:var(--del);border-color:var(--del);color:var(--del-on)}
.kphead .go{min-width:64px}
.ghost{background:transparent}
.muted{color:var(--muted);font-size:14px}
.warning{background:var(--warn-soft);color:var(--warn);padding:10px 12px;border-radius:var(--r);font-size:14px}
.note{background:var(--soft);padding:10px 12px;border-radius:var(--r);font-size:14px}
.good{background:var(--ok-soft);color:var(--ok);padding:10px 12px;border-radius:var(--r);font-weight:600;font-size:15px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1 1 0;min-width:0}

/* 外框 */
.bar{flex:none;display:flex;align-items:center;gap:8px;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.bar h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{min-height:38px;font-size:14px}
.shell{flex:1;min-height:0;display:flex;flex-direction:column}
.page{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-block:2px 8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.nav{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{border:0;border-radius:0;background:transparent;min-height:58px;padding:4px 2px;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;border-top:3px solid transparent}
.nav button span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav small{font-weight:500;color:var(--muted);font-size:11px}
.nav small.done{color:var(--ok)}
.nav button[aria-current="true"]{border-top-color:var(--ink);background:var(--soft)}
@media (min-width:760px){
  .shell{flex-direction:row-reverse}
  .nav{width:128px;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-left:env(safe-area-inset-left,0px)}
  .nav button{flex:1;max-height:96px;font-size:15px;border-top:0;border-left:4px solid transparent}
  .nav button[aria-current="true"]{border-left-color:var(--ink)}
}

/* 比賽列表、資料 */
.match{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.match .t{min-width:0;flex:1 1 200px}
.match strong{display:block;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:0 7px;border-radius:4px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fields .wide{grid-column:1/-1}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* 隊伍頁 */
.teampage{--c:var(--t1);--s:var(--t1-soft);--o:var(--t1-on)}
.teampage.t2{--c:var(--t2);--s:var(--t2-soft);--o:var(--t2-on)}
.nameline{display:flex;gap:6px;align-items:flex-end}
.nameline>div{flex:1;min-width:0}
.swatch{padding:0;background:var(--j);border:2px solid var(--line)}
.nameline button{font-size:14px;padding:0 10px}
.nameline label{font-size:0;gap:0}
.split{flex:none;display:flex;flex-direction:column;gap:8px}
.foot{flex:none;display:flex;flex-direction:column;gap:6px;margin-top:auto}
.full{width:100%}
/* 所有號碼格都是同尺寸正方形，不隨畫面拉伸 */
.rosterbox{display:flex;flex-direction:column;gap:4px;min-width:0}
.chips,.libs,.pad,.benchrow{display:grid;grid-template-columns:repeat(6,minmax(0,60px));gap:6px;justify-content:start}
.libs{align-items:center}
.sec{font-size:13px;font-weight:600;color:var(--muted)}
.sec.lib{margin-top:8px;color:var(--c)}
.chip{position:relative;aspect-ratio:1;min-height:0;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--s);color:var(--c);border-color:transparent;min-width:0}
.chip b{font-size:21px;line-height:1.1}
.chip small{position:absolute;left:2px;right:2px;bottom:1px;text-align:center;font-size:10px;line-height:1.2;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ul{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.chip.blank{background:transparent;border:1px dashed var(--line);color:var(--muted);cursor:default;font-size:14px;font-weight:600}
button.chip.blank{cursor:pointer}
.bench .chip[aria-pressed="true"]:not(.blank){outline:3px solid var(--ok)}
.chip.lib:not(.blank){background:var(--c);color:var(--o)}
.chip.lib:not(.blank) small{color:var(--o)}
.chip.editing{outline:3px solid var(--ink);outline-offset:1px}
.chip.blank.editing{background:var(--s);border-style:solid;color:var(--c)}
.chip.lib.blank:not(.editing)::after{content:"L";color:var(--muted);font-weight:600}
.hint{grid-column:1/-1;height:42px;display:flex;align-items:center;font-size:14px;color:var(--muted)}
.hint.err{color:var(--bad);font-weight:600}
.acts{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kp .acts button{height:40px;min-height:0;font-size:14px}
.kp .acts button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--o)}
.chip:disabled{opacity:1;cursor:default}
.chip.off:disabled{opacity:.35}
.chip[aria-pressed="true"]:not(.blank){outline:3px solid var(--c)}
.pad button{aspect-ratio:1;min-height:0;font-size:21px;padding:0}
.pad .add{background:var(--c);border-color:var(--c);color:var(--o);font-size:15px}
.colors{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.colors button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;padding:2px;font-size:12px}
.colors i{display:block;width:26px;height:26px;border-radius:6px;background:var(--j);border:1px solid var(--muted)}
.colors button[aria-pressed="true"]{outline:3px solid var(--ink)}
.pad .back{font-size:17px}
.bench .chip.t2{--c:var(--t2);--s:var(--t2-soft)}
.bench .chip.t1{--c:var(--t1);--s:var(--t1-soft)}
@media (min-width:760px){.split{flex-direction:row;gap:24px}}

/* 名單：比照紙本，兩隊並列、號碼＋姓名兩欄 */
.sheetgrid{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:2px solid var(--ink);border-radius:4px;background:var(--panel)}
.sheetgrid>*{min-width:0}
.rh.t1,.rr.t1,.ch.t1{border-right:2px solid var(--ink)}
.rh{--c:var(--t1);display:flex;gap:3px;align-items:center;padding:3px;border-bottom:1px solid var(--ink)}
.rh.t2{--c:var(--t2)}
.rh input{min-height:32px;height:32px;padding:0 4px;font-weight:700;color:var(--c);border:0;background:transparent;flex:1;min-width:0}
.rh .swatch{width:28px;height:28px;min-height:0;border-radius:4px;flex:none}
.ab{font-weight:700;color:var(--c);padding:0 3px}
.ch{display:grid;grid-template-columns:42px 1fr;font-size:12px;color:var(--muted);text-align:center;border-bottom:1px solid var(--ink)}
.rr{--c:var(--t1);--s:var(--t1-soft);display:grid;grid-template-columns:42px minmax(0,1fr);height:26px;border-bottom:1px solid var(--line)}
.rr.t2{--c:var(--t2);--s:var(--t2-soft)}
.num{min-height:0;height:100%;padding:0;border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;color:var(--c)}
.num b{font-size:16px;line-height:1}
.circ{display:inline-flex;align-items:center;justify-content:center;border:2px solid currentColor;border-radius:50%}
.num b.circ{width:23px;height:23px;font-size:13px}
.cell b.circ{width:60px;height:60px;border-width:3px;font-size:30px}
.chip b.circ{width:38px;height:38px;font-size:17px}
.mk{font-style:normal;font-weight:800;margin-right:5px;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:2px solid currentColor;border-radius:4px;font-size:13px}
.mk.c{border-radius:50%}
.rr.t1,.lusheet.t1,.bench .chip.t1{--j:var(--t1-j);--jt:var(--t1-jt)}
.rr.t2,.lusheet.t2,.bench .chip.t2{--j:var(--t2-j);--jt:var(--t2-jt)}
.num.on{background:var(--s);outline:3px solid var(--ok);outline-offset:-3px}
.num.fill,.cell.fill,.bench .chip{background:var(--j);color:var(--jt);border-color:var(--line)}
.num.fill{border-bottom:1px solid var(--line)}
.num:disabled{opacity:1;cursor:default}
.rr input{min-height:0;height:100%;padding:0 4px;border:0;border-radius:0;background:transparent;line-height:1}
.rr input:disabled{background:transparent;color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink)}
.band{grid-column:1/-1;text-align:center;font-size:12px;font-weight:700;padding:2px 0;border-bottom:1px solid var(--ink);border-top:1px solid var(--ink)}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;flex:none;margin-top:auto}
.tool{--c:var(--t1);--s:var(--t1-soft);--o:var(--t1-on);display:flex;flex-direction:column;gap:5px;min-width:0}
.tool.t2{--c:var(--t2);--s:var(--t2-soft);--o:var(--t2-on)}
.count{font-size:14px;font-weight:600;color:var(--c)}
.tool button{min-height:36px;font-size:14px;padding:0 4px}
.tool .good{padding:6px;text-align:center}
.tool .foot button{min-height:40px;font-size:14px;width:100%}
.page.kpopen{padding-bottom:230px}
.kp{--c:var(--t1);--s:var(--t1-soft);--o:var(--t1-on);position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:2px solid var(--ink);display:flex;flex-direction:column;gap:6px;align-items:center;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.kp.t2{--c:var(--t2);--s:var(--t2-soft);--o:var(--t2-on)}
.kp>*{width:100%;max-width:396px}
.kphead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.kphead button{min-height:36px;font-size:14px}
.kphead .err{color:var(--bad);font-weight:600}
.kp .subbody{min-height:84px;display:flex;flex-direction:column;gap:6px}
.kp .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kp .pad{justify-content:space-between}

/* 比賽：上比分、中球場、下得分鈕 */
.ptsum{display:flex;flex-direction:column;gap:1px}
.ptset{display:grid;grid-template-columns:auto 58px minmax(0,1fr) 58px;gap:6px;align-items:end}
.sw{display:flex;flex-direction:column;gap:3px;min-width:0}
.sw .seg button{font-size:14px;padding:0 2px;line-height:1.15}
.ptset strong{padding-bottom:12px}
.board{display:grid;grid-template-columns:minmax(0,1fr) 46px 88px 46px minmax(0,1fr);align-items:center;gap:4px;flex:none}
.ss{display:flex;flex-direction:column;align-items:center;min-width:0}
.ss.t1{--c:var(--t1)}.ss.t2{--c:var(--t2)}
.ss .tn{font-weight:700;color:var(--c);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss b{font-size:42px;line-height:1.05}
.mid{text-align:center;font-weight:700;font-size:14px}
.mid small{font-weight:500;color:var(--muted)}
.pcourt{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) 5px repeat(2,minmax(0,1fr));grid-auto-rows:52px;gap:3px;width:100%;max-width:400px;align-self:center}
.net{grid-column:3;grid-row:1/4;background:var(--ink);border-radius:2px}
.pc{position:relative;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--j);color:var(--jt);border:1px solid var(--line);padding:0;min-height:0}
.pc:disabled{opacity:1;cursor:default}
.pc.pk{box-shadow:0 0 0 2px var(--ink)}
.pc.sel{outline:3px solid var(--ok);outline-offset:-3px}
.lockline{text-align:center;flex:none}
.scrim.light{background:transparent}
.tbar{flex:none;display:flex;align-items:center;gap:8px;padding:3px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-size:14px}
.tbar span{flex:1;min-width:0}
.tbar b{font-size:24px;line-height:1}
.tbar button{min-height:34px;font-size:13px}
.tpop{position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:30;width:260px;max-width:calc(100% - 32px);padding:18px 14px;text-align:center;background:var(--panel);border:3px solid #E5281E;border-radius:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.tpop b{font-size:72px;line-height:1;color:#E5281E}
.tx{position:absolute;right:6px;top:6px;width:40px;height:40px;min-height:0;padding:0}
.lmk{position:absolute;right:0;top:0;width:22px;height:20px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:#F7CE1E;color:#141414;border-radius:0 5px 0 5px}
.pc.isl{box-shadow:inset 0 0 0 3px #F7CE1E}
@keyframes flashbad{0%,49%{box-shadow:0 0 0 4px #E5281E,inset 0 0 0 4px #E5281E}50%,100%{box-shadow:0 0 0 4px transparent,inset 0 0 0 3px #F7CE1E}}
.pc.bad{outline:0;animation:flashbad .7s linear infinite;z-index:1}
@media (prefers-reduced-motion:reduce){.pc.bad{animation:none;box-shadow:0 0 0 4px #E5281E,inset 0 0 0 4px #E5281E}}
.strips,.tt{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none;width:100%;max-width:400px;align-self:center}
.strip{display:flex;justify-content:space-between;gap:6px}
.ls{display:flex;gap:4px}
.lc{position:relative;width:46px;height:46px;min-height:0;padding:0;background:var(--j);color:var(--jt);border-color:var(--line)}
.lc.t1{--j:var(--t1-j);--jt:var(--t1-jt)}.lc.t2{--j:var(--t2-j);--jt:var(--t2-jt)}
.lc span{position:absolute;right:3px;top:1px;font-size:10px;font-weight:800}
.lc b{font-size:18px}
.lc.away{opacity:.35}
.lc:disabled{cursor:default}
.lc.sel{outline:3px solid var(--ok)}
.oc{position:relative;width:46px;height:46px;min-height:0;padding:0;border-style:dashed;background:transparent}
.oc b{font-size:18px}
.oc span{position:absolute;left:0;right:0;bottom:1px;font-size:10px;color:var(--muted)}
.oc:not(:disabled){border-color:var(--ok);border-style:solid}
.oc:disabled{opacity:1;cursor:default}
.tg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.tg .ex{grid-column:1/-1;font-size:12px;color:var(--muted);text-align:center}
.penbtn{flex:none;min-height:38px;width:100%;background:var(--del);border-color:var(--del);color:var(--del-on)}
.irb{display:flex;gap:14px;align-items:center;font-size:14px}
.irb i{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border:1px solid var(--line);font-style:normal;font-weight:800;color:var(--bad)}
.logbox{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.rotb{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
.rotb button{min-height:40px;font-size:14px;padding:0 4px}
.ghost-file{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid var(--line);border-radius:var(--r);font-weight:600;color:var(--ink);flex-direction:row}
.ghost-file input{position:absolute;opacity:0;width:1px;height:1px}
/* 記錄表：一律白底黑字，比照紙本 A4 橫式 */
.rv{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg)}
.rvbar{flex:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:calc(6px + env(safe-area-inset-top,0px)) 6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.rvbar button{min-height:40px;font-size:14px}
.rvscroll{flex:1;min-height:0;overflow:auto;background:#777;padding:10px}
.paper{--ink:#000;--line:#000;--muted:#333;--bad:#000;width:277mm;min-height:190mm;background:#fff;color:#000;padding:0;font-size:8pt;line-height:1.15;font-variant-numeric:tabular-nums;margin:0 auto}
.paper h1{font-size:13pt;text-align:center}
.paper h3{font-size:8pt;margin:1.2mm 0 .5mm}
.ph div{display:flex;flex-wrap:wrap;gap:0 5mm;margin:1mm 0;border-bottom:1px solid #000;padding-bottom:1mm}
.pm{display:grid;grid-template-columns:197mm 79mm;gap:1mm}
.setb{border:1px solid #000;margin-bottom:1mm}
.seth{display:flex;gap:5mm;padding:.5mm 1mm;border-bottom:1px solid #000}
.setg{display:grid;grid-template-columns:1fr 1fr}
.tb{min-width:0}
.tb+.tb{border-left:1px solid #000}
.tbh{padding:.4mm 1mm;border-bottom:1px solid #000;display:flex;gap:1.5mm;align-items:center}
.tbh .to{margin-left:auto}
.ci{display:inline-flex;align-items:center;justify-content:center;width:4mm;height:4mm;border:1px solid #000;border-radius:50%;font-size:7pt}
.tbb{display:grid;grid-template-columns:minmax(0,1fr) auto}
.paper table{border-collapse:collapse;width:100%}
.paper th,.paper td{border:.5px solid #000;padding:.3mm .4mm;text-align:center;font-weight:400;color:#000;font-size:7.5pt}
.lu th{white-space:nowrap;width:9mm;font-size:6.5pt}
.lu td{width:12.5mm;height:4.6mm}
.lu .rd td{height:11mm;vertical-align:top;font-size:7pt;word-spacing:1px}
.xm{font-weight:700}
.endc{display:inline-block;border:1px solid #000;border-radius:50%;padding:0 .6mm}
.pts{display:grid;grid-auto-flow:column;grid-auto-columns:3.6mm;font-size:5.5pt;border-left:.5px solid #000;height:100%;min-height:42mm}
.pt{display:flex;align-items:center;justify-content:center;position:relative;border-bottom:.2px solid #bbb}
.pt.on::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:.8px solid #000;transform:rotate(-40deg)}
.pt.pen{border-radius:50%;outline:.6px solid #000}
.pt.last{font-weight:800;border-bottom:1.2px solid #000}
.pt.off{color:#999}
.ros{display:grid;grid-template-columns:1fr 1fr;gap:.6mm}
.ro td:first-child{width:7mm}
.ro td,.ro th{height:3.6mm;font-size:6.5pt}
.ro .sg{height:6mm}
.ca{display:inline-flex;align-items:center;justify-content:center;min-width:3.6mm;border:.7px solid #000;border-radius:50%}
.paper .res th,.paper .res td{font-size:6.5pt;padding:.3mm}
.paper .res b{font-weight:700}
.paper .irb{gap:3mm;font-size:7pt;margin-bottom:.5mm}
.paper .irb i{width:3.6mm;height:3.6mm;border-color:#000;color:#000}
.ts{display:flex;justify-content:space-between;margin-top:.5mm;font-size:7pt}
.nt{border:.5px solid #000;min-height:8mm;padding:.5mm;font-size:6.5pt}
.sgn th{width:12mm}.sgn td{height:6mm}
@media print{
  @page{size:A4 landscape;margin:8mm 10mm}
  html,body{height:auto;overflow:visible;background:#fff}
  #app{display:block;height:auto;max-width:none}
  #app>:not(.rv){display:none!important}
  .rv{position:static;display:block;background:#fff}
  .rvbar{display:none}
  .rvscroll{overflow:visible;padding:0;background:#fff}
  .paper{margin:0;zoom:.97}
}
.rtabs{display:flex;flex-wrap:wrap;gap:4px;flex:none}
.rtabs button{flex:1 1 auto;min-height:38px;font-size:13px;padding:0 6px}
.rtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rt{--c:var(--t1)}.rt.t2{--c:var(--t2)}
.rth{display:flex;gap:10px;align-items:baseline;font-size:13px;flex-wrap:wrap;margin-bottom:2px}
.rth b{color:var(--c);font-size:15px}
.paper .rl,.rl{table-layout:fixed}
.rl th{font-size:12px;width:38px;font-weight:600}
.rl .sm th,.rl .sm td{padding:2px 1px}
.rl td{font-size:14px;min-width:0}
.rl small{font-size:11px;color:var(--muted)}
.rl .rr2 td{vertical-align:top;line-height:1.3}
.rend{display:inline-block;border:1.5px solid currentColor;border-radius:50%;padding:0 4px}
.notes{padding-left:18px;display:flex;flex-direction:column;gap:6px}
.pk3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pk3.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.pk3.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pk3 button:disabled{background:var(--soft);border-color:var(--line);color:var(--muted);opacity:1}
.pbtns{flex:none;display:grid;grid-template-columns:.8fr 1.45fr .8fr .8fr 1fr;gap:4px}
.pbtns button{padding:0 2px;font-size:13px;white-space:nowrap}
.injbtn{min-height:38px;font-size:13px;padding:0 2px}
.pk3 button{font-size:13px;padding:0 3px;min-height:44px}
.ic{display:flex;justify-content:center;height:24px;align-items:center}
.cd{display:block;width:15px;height:21px;border-radius:2px;box-shadow:0 0 0 1px rgba(127,127,127,.6)}
.cy{background:#F7CE1E}.cr{background:#D3122F}
.ic.same .cd:first-child{transform:rotate(-8deg)}
.ic.same .cd:last-child{margin-left:-7px;transform:rotate(6deg)}
.ic.apart{gap:16px}
.pk3 button{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15}
.pk3 small{font-size:11px;color:var(--muted);font-weight:500}
.stf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stf button{font-size:13px;padding:0 2px}
.excbtn{border-color:var(--warn);color:var(--warn)}
.tg button{min-height:36px;font-size:12px;padding:0 2px}
.sv{width:100%;min-height:64px;font-size:22px;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rp{min-height:0;font-size:15px;padding:0 4px}
.warnbtn{min-height:32px;font-size:13px;background:var(--warn-soft);color:var(--warn);border-color:var(--warn);flex:none}
.pc.t1{--j:var(--t1-j);--jt:var(--t1-jt)}.pc.t2{--j:var(--t2-j);--jt:var(--t2-jt)}
.pc b{font-size:24px;line-height:1}
.pc b.circ{width:36px;height:36px;font-size:18px}
.pc .pos{position:absolute;top:1px;left:4px;font-size:11px;opacity:.75}
.pc .ball{position:absolute;right:2px;bottom:2px;width:20px;height:20px;filter:none;opacity:1}
.pc.srv{outline:3px solid var(--ok);outline-offset:-1px}
.srvline{text-align:center;flex:none}
.sbs{display:grid;grid-template-columns:1fr 60px 1fr;gap:6px;flex:none}
.sb{min-height:64px;font-size:16px;line-height:1.2;background:var(--j);color:var(--jt);border-color:var(--line);overflow-wrap:anywhere}
.sb.t1{--j:var(--t1-j);--jt:var(--t1-jt)}.sb.t2{--j:var(--t2-j);--jt:var(--t2-jt)}
.bigscore{font-size:44px;font-weight:800;text-align:center}
.res{width:100%;border-collapse:collapse;font-size:14px;table-layout:auto}
.res .sm th{font-size:11px;font-weight:600;padding:3px 1px}
.res .tot td{font-weight:700}
.times{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:14px}
.cfr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cf{--c:var(--t1);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border:1px solid var(--line);border-radius:var(--r);min-width:0}
.cf.t2{--c:var(--t2)}
.cf strong{color:var(--c);overflow-wrap:anywhere;text-align:center}
.cf small{color:var(--c)}
.cf .ball{width:52px;height:52px}
.res th,.res td{border:1px solid var(--line);padding:6px 2px;text-align:center}

/* 挑邊：坐在記錄台看出去，兩隊左右對放 */
.toss{display:grid;grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr);gap:6px;align-items:center;max-width:480px;width:100%;align-self:center}
.side{--c:var(--t1);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;min-height:0;position:relative;min-width:0;border:2px solid var(--line)}
.side.t2{--c:var(--t2)}
.side.on{border-color:var(--c)}
.side:disabled{opacity:1;cursor:default}
.side strong{color:var(--c);font-size:17px;overflow-wrap:anywhere;text-align:center}
.side small{font-size:13px;color:var(--c);min-height:18px}
.ltr{font-size:15px;font-weight:700;color:var(--muted)}
.ball{transition:filter .15s,opacity .15s}
.side:not(.on) .ball{filter:grayscale(1);opacity:.4}
.swap{width:52px;height:52px;padding:0;font-size:22px;min-height:0}
.scorer{align-self:center;font-size:13px;color:var(--muted);border-top:2px solid var(--line);padding:3px 28px 0}
.ask{display:flex;flex-direction:column;gap:6px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{min-height:72px;font-size:17px;overflow-wrap:anywhere;padding:4px 8px}
.pick button.t1[aria-pressed="true"]{background:var(--t1);border-color:var(--t1);color:var(--t1-on)}
.pick button.t2[aria-pressed="true"]{background:var(--t2);border-color:var(--t2);color:var(--t2-on)}

/* 陣容單：比照紙本，前排 IV III II，後排 V VI I */
.lutabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lutabs button{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lutabs button.t1[aria-pressed="true"]{background:var(--t1-j);border-color:var(--ok);color:var(--t1-jt)}
.lutabs button.t2[aria-pressed="true"]{background:var(--t2-j);border-color:var(--ok);color:var(--t2-jt)}
.lusheet{--c:var(--t1);--s:var(--t1-soft);flex:none;width:292px;max-width:100%;align-self:center;border:2px solid var(--ink);border-radius:4px;background:var(--panel)}
.lusheet.t2{--c:var(--t2);--s:var(--t2-soft)}
.lusheet header{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.lusheet header span{font-size:14px;color:var(--muted);min-width:0}
.sheetnet{text-align:center;font-size:12px;letter-spacing:.4em;color:var(--muted);border-bottom:1px dashed var(--line);padding:1px 0}
.lugrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.cell{--c:inherit;position:relative;padding:0;aspect-ratio:1;min-height:0;border:0;border-radius:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;color:var(--c);display:flex;align-items:center;justify-content:center}
.cell:nth-child(3n){border-right:0}
.cell:nth-child(n+4){border-bottom:0}
.cell b{font-size:34px;line-height:1}
.cell .pos{position:absolute;top:3px;left:7px;font-size:13px;font-weight:700;color:var(--muted)}
.cell.sel{background:var(--s);outline:4px solid var(--ok);outline-offset:-4px}
.cell.fill.sel{background:var(--j)}
.cell:disabled{opacity:1;cursor:default}
.bench{display:flex;flex-direction:column;gap:6px;flex:none}

/* 浮動面板：手機從下方出現，平板靠右 */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:12px 12px 0 0;max-height:84%;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
@media (min-width:760px){.sheet{left:auto;top:0;width:360px;max-height:none;border-radius:12px 0 0 12px;padding-top:calc(14px + env(safe-area-inset-top,0px))}}
.sheet .imp{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left}
.sheet .imp small{font-weight:500;color:var(--muted);white-space:nowrap}
.flag[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.sheettabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.sheettabs button{flex:0 0 auto;padding:0 10px}
.sv-wrap{flex:none;width:100%;background:#fff;border-radius:2px;overflow:hidden}
.sv-wrap svg{display:block;width:100%;height:auto}
.rotate-tip{text-align:center}
.ppr{flex:none;background:#fff;color:#000;border:3px solid #000;width:100%;max-width:560px;margin:0 auto;--pi:#1616c8}
.ppr h3{margin:0;padding:8px;text-align:center;font-size:20px;font-weight:800;color:#000;border-bottom:2px solid #000}
.ppr table{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff}
.ppr th,.ppr td{border:1px solid #000;text-align:center;padding:5px 2px;color:var(--pi);font-size:16px;height:36px;background:#fff;font-weight:400}
.ppr th,.ppr .ph th{color:#000;font-size:12px;font-weight:700}
.ppr .pset{width:24%;color:var(--pi)}
.ppr th.pset{color:#000}
.ppr .pset small{color:#000;font-size:10px}
.ptot td{border-top:2px solid #000}
.pvs{display:grid;grid-template-columns:1fr auto auto 1fr;gap:6px;align-items:center;padding:6px;border-bottom:2px solid #000}
.pvs b{color:var(--pi);text-align:center;font-size:15px;overflow-wrap:anywhere}
.pvs i,.pteams i{font-style:normal;font-weight:800;border:2px solid #000;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;color:#000}
.ptm{display:grid;grid-template-columns:1fr 1fr 1.4fr;border-top:2px solid #000}
.ptm div{padding:4px;text-align:center;color:var(--pi);font-size:15px;min-height:46px;border-left:1px solid #000}
.ptm div:first-child{border-left:0}
.ptm small{display:block;color:#000;font-size:11px}
.pwin{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 12px;border-top:3px solid #000}
.pwin span{font-weight:800;color:#000;font-size:18px}
.pwin b{color:var(--pi);font-size:18px;text-align:center}
.psh{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid #000}
.psh h3{border:0;border-right:2px solid #000}
.psh div{text-align:center;padding:4px;color:#000}
.psh small{display:block;font-size:12px;font-weight:700}
.psh i{font-style:normal;display:inline-block;min-width:14px;color:var(--pi);font-weight:800}
.psan table{border-bottom:2px solid #000}
.psan td{height:30px}
.psan p{margin:0;padding:6px 8px;font-size:12px;color:#000;line-height:1.5}
.prem ul{margin:0;padding:6px 12px 6px 28px;color:var(--pi);font-size:15px;line-height:1.7;border-bottom:1px solid #000}
.prem textarea,.psign input{width:100%;border:0;background:#fff;color:var(--pi);font:inherit;font-size:16px;min-height:0;border-radius:0;padding:6px}
.prem textarea{display:block;line-height:32px;resize:vertical;padding:0 10px;background-image:repeating-linear-gradient(#fff 0 31px,#888 31px 32px);background-attachment:local}
.prem textarea::placeholder{color:#777}
.psign th:first-child{width:24%}
.psign .psig{width:32%}
.psign td{padding:0 2px}
.pauto{font-size:14px!important}
.pname{padding:8px 10px;border-bottom:2px solid #000;color:#000}
.pname span{font-weight:800;font-size:13px;display:block}
.pname b{color:var(--pi);font-size:20px;font-weight:500}
.pgrid{display:grid;grid-template-columns:1fr 1fr}
.pf{padding:6px 10px;border-bottom:1px solid #000;border-right:1px solid #000;min-height:52px;color:#000}
.pf:nth-child(2n){border-right:0}
.pf span{display:block;font-size:12px;font-weight:700}
.pf b{color:var(--pi);font-weight:400;font-size:16px}
.pteams{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:8px;align-items:center;padding:12px 10px}
.pteams b{color:var(--pi);text-align:center;font-size:17px;overflow-wrap:anywhere}
.pteams em{font-style:normal;color:#000;font-weight:800}
.proster table{border-top:2px solid #000}
.proster .pno{width:13%}
.proster td{height:30px}
.proster .pnm{text-align:left;padding-left:6px;font-size:15px;overflow-wrap:anywhere}
.pcap{display:inline-grid;place-items:center;width:26px;height:26px;border:2px solid var(--pi);border-radius:50%}
.proster .psec th{font-size:14px;height:28px}
.proster .pol{width:24%}
.sheetback{flex:none;width:100%}
.srvmark{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:2px;color:var(--t1);--ball:30px}
.srvmark.t2{color:var(--t2)}
.srvmark i{font-style:normal;font-size:20px;line-height:1}
.srvmark span{width:var(--ball);height:var(--ball);display:block;flex:none}
.srvmark span svg,.srvmark span img{display:block;width:100%;height:100%;opacity:1;filter:none}
.srvmark b{font-size:26px;line-height:1;font-weight:800}
.tbar.t1{background:var(--t1-j);color:var(--t1-jt);border-color:var(--t1-j)}
.tbar.t2{background:var(--t2-j);color:var(--t2-jt);border-color:var(--t2-j)}
.tbar b{color:inherit}
.tbar span{font-weight:800}
.tbar button{background:#fff;color:#141414;border-color:#fff}
.setbox{display:flex;flex-direction:column;align-items:center;border:2px solid var(--line);border-radius:var(--r);padding:2px 0;background:var(--panel)}
.setbox.t1{border-color:var(--t1)}.setbox.t2{border-color:var(--t2)}
.setbox small{font-size:11px;color:var(--muted);line-height:1.2}
.setbox b{font-size:26px;line-height:1.1}
.teampick{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
.teampick button{min-height:50px;font-weight:800;font-size:16px;border:3px solid var(--line);padding:0 6px}
.teampick .t1{background:var(--t1-j);color:var(--t1-jt)}
.teampick .t2{background:var(--t2-j);color:var(--t2-jt)}
.teampick.picked button{opacity:.4}
.teampick.picked button[aria-pressed="true"]{opacity:1;border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.bartime{flex:none;display:flex;gap:9px;font-size:11px;line-height:1.2;color:var(--muted);white-space:nowrap;text-align:right}
.bartime b{color:var(--ink);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.bar h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subhint{font-size:18px;font-weight:800;line-height:1.3}
.kp.t1 .subhint{color:var(--t1)}.kp.t2 .subhint{color:var(--t2)}
.fixpos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}
.fixpos button{min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px}
.fixpos small{font-size:12px;color:var(--muted)}
.fixpos b{font-size:26px;line-height:1.1}
.fsbtn{flex:none;align-self:center;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;font-size:15px;font-weight:700}
.fsv{position:fixed;inset:0;z-index:90;background:#fff}
.fsin{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.fssheet{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px}
.fssheet .sv-wrap{width:100%;height:100%}
.fssheet svg{width:100%;height:100%}
.fsclose{flex:none;min-height:40px;margin:0 4px 4px;background:#141414;color:#fff;border-color:#141414;font-size:15px;font-weight:700}
@media (orientation:portrait){
.fsin{inset:auto;top:50%;left:50%;width:100vh;height:100vw;width:100dvh;transform:translate(-50%,-50%) rotate(90deg)}
}
.breakt{font-size:13px}
.breakt b{font-size:22px}
.lucopy{flex:none;width:100%;min-height:44px;font-weight:700}
.toask{flex:none;padding:10px;border-radius:var(--r);text-align:center;font-size:18px;font-weight:800}
.toask.t1{background:var(--t1-j);color:var(--t1-jt)}
.toask.t2{background:var(--t2-j);color:var(--t2-jt)}
.fixrow{flex:none;width:100%;display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:center;text-align:left;min-height:48px;padding:0 12px;font-size:15px}
.fixrow.t1 span{color:var(--t1)}.fixrow.t2 span{color:var(--t2)}
.fixrow span{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fixrow em{font-style:normal;color:var(--muted)}
.irrow{display:inline-flex;align-items:center;gap:5px;font-size:14px}

.pfbtn{color:var(--danger,#c0392b)}
</style>

<div id="app"></div>

<script>
(function(){
'use strict';
/* ========== 資料層：所有變動都是事件，畫面狀態一律由 reduce() 從事件推算 ========== */
var KEY='nanshe-scoresheet-v1';
var DEVICE='scorer-table';   // 日後連線同步時用來分辨事件來源
var MAX_PLAYERS=12, MAX_LIBEROS=2, MIN_ON_COURT=6;
var memoryOnly=false;

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var d=JSON.parse(raw); if(d&&Array.isArray(d.matches)) return d;}
    localStorage.setItem(KEY+'-test','1'); localStorage.removeItem(KEY+'-test');
  }catch(e){memoryOnly=true}
  return {matches:[],currentId:null};
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db)); memoryOnly=false}
  catch(e){memoryOnly=true}
}
var db=load();

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function emptyTeam(){return {name:'',players:[],captain:null,liberos:[],staff:{coach:'',execCoach:'',teacher:'',leader:''},locked:false,color:null,liberoColor:null}}

function other(k){return k==='t1'?'t2':k==='t2'?'t1':null}
function emptySet(){return {left:null,serve:null,lineups:{t1:[null,null,null,null,null,null],t2:[null,null,null,null,null,null]},gameCaptain:{t1:null,t2:null},locked:{t1:false,t2:false},started:false,score:{t1:0,t2:0},serving:null,rot:{t1:0,t2:0},swapped:false,ended:false,winner:null,startAt:null,endAt:null,firstServeAt:null,
  cur:{t1:null,t2:null},rally:0,live:false,replayLock:false,timeouts:{t1:[],t2:[]},subCount:{t1:0,t2:0},subs:{t1:[],t2:[]},
  subPos:{t1:[{},{},{},{},{},{}],t2:[{},{},{},{},{},{}]},out:{t1:[],t2:[]},libOut:{t1:null,t2:null},libRally:{t1:null,t2:null},subRally:{t1:null,t2:null},expelled:{t1:[],t2:[]},rounds:{t1:[[],[],[],[],[],[]],t2:[[],[],[],[],[],[]]},subRows:{t1:[[],[],[],[],[],[]],t2:[[],[],[],[],[],[]]},toRows:{t1:[],t2:[]},penPts:{t1:[],t2:[]},swapScore:null,swapSnap:null,libRows:{t1:[],t2:[]}}}
function applyPoint(c,k){
  var lo=other(k);
  c.score[k]++; c.rally++; c.live=false; c.replayLock=false;
  if(c.serving!==k){c.rounds[lo][c.rot[lo]].push(c.score[lo]);c.serving=k;c.rot[k]=(c.rot[k]+1)%6}
}
function dropFromLineup(s,k,no){
  var c=s.sets[1],lu=c.lineups[k],i=lu.indexOf(no);
  if(i>=0){lu[i]=null;c.locked[k]=false}
  if(c.gameCaptain[k]===no)c.gameCaptain[k]=null;
}
function reduce(events){
  var s={info:{},teams:{t1:emptyTeam(),t2:emptyTeam()},setNo:1,matchOut:{t1:[],t2:[]},sanctions:[],injuries:[],sets:{1:emptySet(),2:emptySet(),3:emptySet()}};
  /* 復原：UNDO 事件指向被取消的事件，事件本身不刪，日後同步才對得起來 */
  var dead={};
  events.forEach(function(ev){if(ev.type==='UNDO')dead[ev.data.target]=1});
  var patch={};
  s.log=[];s.amends=[];
  events.forEach(function(ev){
    if(ev.type!=='AMEND'||dead[ev.id])return;
    s.amends.push(ev.data.note);
    if(ev.data.del)dead[ev.data.target]=1;
    else patch[ev.data.target]=Object.assign(patch[ev.data.target]||{},ev.data.patch);
  });
  events.filter(function(ev){return !dead[ev.id]&&ev.type!=='UNDO'&&ev.type!=='AMEND'}).forEach(function(ev){
    var d=patch[ev.id]?Object.assign({},ev.data,patch[ev.id]):ev.data, t=d.team?s.teams[d.team]:null;
    switch(ev.type){
      case 'MATCH_CREATED': s.info=Object.assign({},d.info); break;
      case 'INFO_SET': s.info[d.field]=d.value; break;
      case 'TEAM_NAME_SET': t.name=d.value; break;
      case 'PLAYER_ADDED': t.players.push({no:d.no,name:''}); break;
      case 'PLAYER_NAME_SET': t.players.forEach(function(p){if(p.no===d.no)p.name=d.name}); break;
      case 'PLAYER_NUMBER_CHANGED':
        t.players.forEach(function(p){if(p.no===d.from)p.no=d.to});
        if(t.captain===d.from)t.captain=d.to;
        s.sets[1].lineups[d.team]=s.sets[1].lineups[d.team].map(function(n){return n===d.from?d.to:n});
        if(s.sets[1].gameCaptain[d.team]===d.from)s.sets[1].gameCaptain[d.team]=d.to;
        t.liberos=t.liberos.map(function(n){return n===d.from?d.to:n});
        break;
      case 'PLAYER_REMOVED':
        t.players=t.players.filter(function(p){return p.no!==d.no});
        dropFromLineup(s,d.team,d.no);
        if(t.captain===d.no)t.captain=null;
        t.liberos=t.liberos.filter(function(n){return n!==d.no});
        break;
      case 'CAPTAIN_SET': t.captain=d.no; break;
      case 'LIBERO_SET':
        t.liberos=t.liberos.filter(function(n){return n!==d.no});
        if(d.on){t.liberos.push(d.no);dropFromLineup(s,d.team,d.no)}
        break;
      case 'STAFF_SET': t.staff[d.field]=d.value; break;
      case 'TEAM_COLOR_SET': t.color=d.color; break;
      case 'LIBERO_COLOR_SET': t.liberoColor=d.color; break;
      case 'TEAM_IMPORTED':
        var snap=JSON.parse(JSON.stringify(d.snapshot));
        snap.locked=false; s.teams[d.team]=snap;
        s.sets[1].lineups[d.team]=[null,null,null,null,null,null]; s.sets[1].locked[d.team]=false; s.sets[1].gameCaptain[d.team]=null;
        break;
      case 'TOSS_SET': var ss=s.sets[d.set]; if(d.left!==undefined)ss.left=d.left; if(d.serve!==undefined)ss.serve=d.serve; break;
      case 'LINEUP_SET':
        var lu=s.sets[d.set].lineups[d.team], was=lu.indexOf(d.no);
        if(d.no!==null&&was>=0)lu[was]=lu[d.pos];
        lu[d.pos]=d.no;
        break;
      case 'LINEUP_COPIED': s.sets[d.set].lineups[d.team]=s.sets[d.set-1].lineups[d.team].map(function(n){return s.matchOut[d.team].indexOf(n)<0?n:null}); break;
      case 'LINEUP_ROTATED':
        var lr=s.sets[d.set].lineups[d.team],st2=d.dir==='cw'?1:5;
        s.sets[d.set].lineups[d.team]=lr.map(function(_,i){return lr[(i+st2)%6]});
        break;
      case 'GAME_CAPTAIN_SET': s.sets[d.set].gameCaptain[d.team]=d.no; break;
      case 'LINEUP_CORRECTED':
        var fc=s.sets[d.set],fl=fc.lineups[d.team],fa=fl[d.pos],fo2=fl.indexOf(d.no),fcur=fc.cur[d.team],flo=fc.libOut;
        var fix=function(i,a,b){if(fcur[i]===a)fcur[i]=b;if(flo[d.team]&&flo[d.team].idx===i&&flo[d.team].no===a)flo[d.team].no=b};
        fl[d.pos]=d.no;fix(d.pos,fa,d.no);
        if(fo2>=0){fl[fo2]=fa;fix(fo2,d.no,fa)}
        (s.corrections=s.corrections||[]).push({set:d.set,team:d.team,score:fc.score[d.team]+':'+fc.score[other(d.team)],pos:d.pos,from:fa,to:d.no,other:fo2});
        break;
      case 'LINEUP_LOCKED': s.sets[d.set].locked[d.team]=true; break;
      case 'LINEUP_UNLOCKED': s.sets[d.set].locked[d.team]=false; break;
      case 'SET_STARTED':
        var st=s.sets[d.set]; st.started=true; st.serving=st.serve; st.startAt=ev.at; st.cur={t1:st.lineups.t1.slice(),t2:st.lineups.t2.slice()};
        if(d.set===1){s.teams.t1.locked=true;s.teams.t2.locked=true}
        break;
      case 'POINT':
        applyPoint(s.sets[d.set],d.team);
        break;
      case 'SANCTION':
        var sn=s.sets[d.set],ot=other(d.team);
        s.sanctions.push({set:d.set,team:d.team,kind:d.kind,who:d.who,score:sn.score[d.team]+':'+sn.score[ot]});
        if(d.kind==='DP'||d.kind==='P'){applyPoint(sn,ot);sn.penPts[ot].push(sn.score[ot])}
        if(d.kind==='E'&&typeof d.who==='number')sn.expelled[d.team].push(d.who);
        if(d.kind==='D'&&typeof d.who==='number')s.matchOut[d.team].push(d.who);
        break;
      case 'INJURY': var ij=s.sets[d.set]; s.injuries.push({team:d.team,no:d.no,set:d.set,raw:{t1:ij.score.t1,t2:ij.score.t2}}); break;
      case 'INCOMPLETE':
        var ic=s.sets[d.set],op=other(d.team);
        s.incomplete={team:d.team,scope:d.scope,set:d.set,raw:{t1:ic.score.t1,t2:ic.score.t2}};
        ic.score[op]=Math.max(target(s,d.set),ic.score[d.team]+2);
        ic.started=true; ic.ended=true; ic.winner=op; ic.endAt=ev.at; ic.live=false;
        if(d.scope==='match'){
          for(var mn=d.set+1;mn<=3&&setsWon(s)[op]<2;mn++){var mc=s.sets[mn];mc.started=true;mc.ended=true;mc.winner=op;mc.score[op]=target(s,mn);mc.endAt=ev.at;mc.left=mc.left||ic.left;s.setNo=mn}
        }
        break;
      case 'PRE_FORFEIT':
        var pw=d.winner,pl2=other(pw);
        s.sets[1].left=pw;s.sets[2].left=pl2;
        [1,2].forEach(function(mn){var mc=s.sets[mn];mc.started=true;mc.ended=true;mc.winner=pw;mc.score[pw]=25});
        s.setNo=2;s.preForfeit={winner:pw,reason:d.reason};
        s.teams.t1.locked=true;s.teams.t2.locked=true;
        break;
      case 'FORFEIT':
        var fo=other(d.team);
        [1,2,3].forEach(function(mn){var mc=s.sets[mn];mc.score={t1:0,t2:0};mc.ended=false;mc.winner=null;mc.started=false});
        [1,2].forEach(function(mn){var mc=s.sets[mn];mc.started=true;mc.ended=true;mc.winner=fo;mc.score[fo]=25;mc.endAt=ev.at;mc.left=mc.left||s.sets[1].left||'t1'});
        if(!s.sets[1].left)s.sets[1].left='t1';
        s.setNo=2;s.forfeit=d.team;
        break;
      case 'SERVE': s.sets[d.set].live=true; if(!s.sets[d.set].firstServeAt)s.sets[d.set].firstServeAt=ev.at; break;
      case 'REPLAY': s.sets[d.set].live=false; s.sets[d.set].replayLock=true; break;
      case 'TIMEOUT': var to=s.sets[d.set]; s.log.push({id:ev.id,set:d.set,kind:'T',team:d.team,score:to.score[d.team]+':'+to.score[other(d.team)]}); to.timeouts[d.team].push(to.score.t1+':'+to.score.t2); to.toRows[d.team].push(to.score[d.team]+':'+to.score[other(d.team)]); break;
      case 'SUB':
        var sb=s.sets[d.set],ps=sb.subPos[d.team][d.idx];
        s.log.push({id:ev.id,set:d.set,kind:'S',team:d.team,idx:d.idx,out:d.out,in:d.in,exc:!!d.exc,ret:!d.exc&&ps.sub!=null,score:sb.score[d.team]+':'+sb.score[other(d.team)]});
        if(!d.exc)sb.subRally[d.team]=sb.rally;
        sb.cur[d.team][d.idx]=d.in;
        sb.subRows[d.team][d.idx].push({in:d.in,score:sb.score[d.team]+':'+sb.score[other(d.team)],exc:!!d.exc});
        sb.subs[d.team].push({out:d.out,in:d.in,score:sb.score.t1+':'+sb.score.t2,exc:!!d.exc,injury:!!d.injury});
        if(d.exc)s.matchOut[d.team].push(d.out);
        else{sb.subCount[d.team]++; if(ps.sub==null)ps.sub=d.in; else ps.done=true}
        break;
      case 'LIBERO_IN': s.log.push({id:ev.id,set:d.set,kind:'L',team:d.team,idx:d.idx}); var li=s.sets[d.set]; li.libOut[d.team]={no:li.cur[d.team][d.idx],idx:d.idx}; li.libRows[d.team].push({lib:d.lib,rep:li.cur[d.team][d.idx],enter:'L',score:li.score[d.team]+':'+li.score[other(d.team)]}); li.cur[d.team][d.idx]=d.lib; li.libRally[d.team]=li.rally; break;
      case 'LIBERO_OUT': var lo=s.sets[d.set],b=lo.libOut[d.team]; lo.libRows[d.team].push({lib:lo.cur[d.team][b.idx],rep:b.no,enter:'R',score:lo.score[d.team]+':'+lo.score[other(d.team)]}); lo.cur[d.team][b.idx]=b.no; lo.libOut[d.team]=null; lo.libRally[d.team]=lo.rally; break;
      case 'LIBERO_SWAP': var ls=s.sets[d.set]; ls.libRows[d.team].push({lib:d.lib,rep:null,enter:'L',score:ls.score[d.team]+':'+ls.score[other(d.team)]}); ls.cur[d.team][ls.libOut[d.team].idx]=d.lib; ls.libRally[d.team]=ls.rally; break;
      case 'SIDES_SWAPPED': var sw=s.sets[d.set]; sw.left=other(sw.left); sw.swapped=true; sw.swapScore=sw.score[sw.left]+':'+sw.score[other(sw.left)]; sw.swapSnap=JSON.parse(JSON.stringify({rounds:sw.rounds,subRows:sw.subRows,toRows:sw.toRows,score:sw.score,libN:{t1:sw.libRows.t1.length,t2:sw.libRows.t2.length}})); break;
      case 'SET_ENDED': var en=s.sets[d.set]; en.ended=true; en.winner=d.winner; en.endAt=ev.at; break;
      case 'SET_ADVANCED':
        var n=s.setNo+1, prev=s.sets[s.setNo]; s.setNo=n;
        if(n===2){s.sets[2].left=other(prev.left); s.sets[2].serve=other(prev.serve)}
        if(!d.blank)['t1','t2'].forEach(function(x){s.sets[n].lineups[x]=prev.lineups[x].map(function(no){return s.matchOut[x].indexOf(no)<0?no:null})});
        break;
    }
    if(t&&s.teams[d.team]===t&&t.players)t.players.sort(function(a,b){return a.no-b.no});
  });
  return s;
}

function current(){return db.matches.filter(function(m){return m.id===db.currentId})[0]||null}
function dispatch(type,data,match){
  var m=match||current();
  m.events.push({id:uid(),matchId:m.id,seq:m.events.length+1,at:new Date().toISOString(),device:DEVICE,type:type,data:data});
  save();
}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function createMatch(info){
  var m={id:uid(),createdAt:new Date().toISOString(),events:[]};
  db.matches.unshift(m);
  dispatch('MATCH_CREATED',{info:info},m);
  return m;
}
function defaultInfo(){
  var last=db.matches[0]?reduce(db.matches[0].events).info:{};
  return {name:last.name||'',division:last.division||'',game:'',date:today(),time:'',place:last.place||'',court:last.court||''};
}
/* 先前比賽的隊伍：不另外建隊伍庫，直接從歷次比賽抓，同隊名取最新一場 */
function pastTeams(excludeId){
  var seen={},list=[];
  db.matches.forEach(function(m){
    if(m.id===excludeId)return;
    var s=reduce(m.events);
    ['t1','t2'].forEach(function(k){
      var t=s.teams[k], key=t.name.trim();
      if(!key||!t.players.length||seen[key])return;
      seen[key]=1;
      list.push({name:key,team:t,date:s.info.date||''});
    });
  });
  return list;
}
function capOf(s,n){return Number(s.info['c'+n])||0}
function capText(s){
  var c=[capOf(s,1),capOf(s,2),capOf(s,3)];
  if(!c[0]&&!c[1]&&!c[2])return 'Deuce 無上限';
  return c.map(function(v,i){return v?'第 '+(i+1)+' 局搶 '+v:'第 '+(i+1)+' 局 Deuce'}).join('・');
}
function target(s,n){return Number(s.info['p'+n])||(n===3?15:25)}
function setsWon(s){var w={t1:0,t2:0};[1,2,3].forEach(function(n){if(s.sets[n].winner)w[s.sets[n].winner]++});return w}
function matchOver(s){var w=setsWon(s);return w.t1>=2||w.t2>=2}
function setWinner(s){
  var n=s.setNo,c=s.sets[n],a=c.score.t1,b=c.score.t2,tg=target(s,n);
  if(c.ended||!c.started)return null;
  var cap=capOf(s,n);
  if(cap&&Math.max(a,b)>=cap)return a>b?'t1':'t2';
  if(Math.max(a,b)>=tg&&Math.abs(a-b)>=2)return a>b?'t1':'t2';
  return null;
}
function needSwap(s){
  var n=s.setNo,c=s.sets[n];
  return n===3&&c.started&&!c.ended&&!c.swapped&&Math.max(c.score.t1,c.score.t2)>=Math.ceil(target(s,3)/2);
}
function courtIdx(c,k,pos){return (pos+c.rot[k])%6}
function courtPlayer(c,k,pos){return (c.cur[k]||c.lineups[k])[courtIdx(c,k,pos)]}
function canPause(c){return !c.live&&!c.replayLock}
function canLib(c,k){return canPause(c)&&(c.libRally[k]===null||c.libRally[k]<c.rally)}
function actingCap(c,t,k){var u=c.cur[k]||c.lineups[k];if(u.indexOf(t.captain)>=0)return t.captain;return u.indexOf(c.gameCaptain[k])>=0?c.gameCaptain[k]:null}
function subOptions(s,k,idx,exc){
  var c=s.sets[s.setNo],t=s.teams[k],now=c.cur[k][idx],ps=c.subPos[k][idx];
  if(t.liberos.indexOf(now)>=0)return {err:'自由球員要先換回原本的球員'};
  var free=t.players.map(function(p){return p.no}).filter(function(n){
    return c.expelled[k].indexOf(n)<0&&t.liberos.indexOf(n)<0&&c.cur[k].indexOf(n)<0&&s.matchOut[k].indexOf(n)<0&&!(c.libOut[k]&&c.libOut[k].no===n)});
  if(exc)return {nos:free};
  if(c.subCount[k]>=6)return {err:'這局 6 次換人已用完'};
  if(ps.done)return {err:'這個位置已換回，不能再換'};
  if(ps.sub!=null){var st0=c.lineups[k][idx];return (c.expelled[k].indexOf(st0)>=0||s.matchOut[k].indexOf(st0)>=0)?{err:'原先發不能上場，請用例外替補'}:{nos:[st0]}}
  var used=[];c.subPos[k].forEach(function(p){if(p.sub!=null)used.push(p.sub)});
  return {nos:free.filter(function(n){return c.lineups[k].indexOf(n)<0&&used.indexOf(n)<0})};
}
function regularCount(t){return t.players.length-t.liberos.length}
function validate(t){
  var regular=t.players.length-t.liberos.length;
  return [
    {ok:!!t.name.trim(),short:'隊名'},
    {ok:regular>=MIN_ON_COURT,short:'球員 '+regular+'/'+MIN_ON_COURT},
    {ok:t.captain!==null,short:'隊長'}
  ];
}

/* ========== 介面狀態（不存檔、不算事件） ========== */
var view=current()?'setup':'home';
var ui={};
function resetUi(){ui={page:'info',entry:{t1:'',t2:''},slot:{t1:null,t2:null},msg:{t1:'',t2:''},sheet:null,pending:null,delMatch:null,sel:null,luTeam:null,lib:null,sub:null,timer:null,cs:false,notice:null,pen:null,report:false,ackL:{t1:null,t2:null}}}
resetUi();

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var app=document.getElementById('app');
var TEAM_LABEL={t1:'隊伍一',t2:'隊伍二'};
/* 球衣色：j 是色票，c／s 是畫面用的字色與底色（淺色、深色主題各一組） */
var JERSEY=[
 {id:'red',n:'紅',j:'#D3122F',l:['#C8102E','#FBDDE1'],d:['#FF8A95','#4A1A20']},
 {id:'orange',n:'橘',j:'#F07A1A',l:['#B8420B','#FBE6DA'],d:['#F59A63','#44260F']},
 {id:'yellow',n:'黃',j:'#F7CE1E',l:['#8A6D00','#FBF0BF'],d:['#F2D04A','#3D330A']},
 {id:'green',n:'綠',j:'#1C9A57',l:['#12713F','#D9F0E2'],d:['#6FD79B','#143524']},
 {id:'blue',n:'藍',j:'#1E7BD6',l:['#0A5AA8','#DCEAF7'],d:['#6FB3F2','#17324B']},
 {id:'navy',n:'深藍',j:'#16245E',l:['#1B2A6B','#DDE1F3'],d:['#9FB0F0','#1E2748']},
 {id:'purple',n:'紫',j:'#6F2DB0',l:['#6A2BA8','#EADFF6'],d:['#C39BF2','#2F1E48']},

function barTime(s){
  var c=s.sets[s.setNo],pv=s.sets[s.setNo-1];

    return '<div class="bartime"><span>開始 <b>'+esc(mst||'—')+'</b></span><span>全場 <b>'+(md==null?'—':(md>=60?Math.floor(md/60)+' 時 ':'')+(md%60)+' 分')+'</b></span><span>結束 <b>'+(men||'—')+'</b></span></div>';
  }
  if(!c.started){
    if(!pv||!pv.endAt)return '';

    return '<div class="bartime breakt"><span>局間休息 <b data-cd="'+dl+'">'+cdText(dl)+'</b></span></div>';
  }
  return '<div class="bartime"><span>開始 <b>'+esc(setStartHM(s,s.setNo)||'—')+'</b></span><span>經過 <b'+(c.firstServeAt&&!c.endAt?' data-el="'+esc(c.firstServeAt)+'"':'')+'>'+elapsed(c.firstServeAt,c.endAt)+'</b></span><span>結束 <b>'+(c.endAt?hm(c.endAt):'—')+'</b></span></div>';

function cdText(dl){var n=Math.max(0,Math.ceil((dl-Date.now())/1000));return Math.floor(n/60)+':'+('0'+n%60).slice(-2)}
function elapsed(from,to){
  if(!from)return '0:00';
  var n=Math.max(0,Math.floor(((to?new Date(to):new Date())-new Date(from))/1000));
  return Math.floor(n/60)+':'+('0'+n%60).slice(-2);
}

function csvText(m,s){
  var A=s.sets[1].left||'t1',B=other(A),nm={t1:tName(s,'t1'),t2:tName(s,'t2')},dead={},lines=[];
  m.events.forEach(function(e){if(e.type==='UNDO')dead[e.data.target]=1});
  var pt={};m.events.forEach(function(e){if(e.type!=='AMEND'||dead[e.id])return;if(e.data.del)dead[e.data.target]=1;else pt[e.data.target]=Object.assign(pt[e.data.target]||{},e.data.patch)});
  function q(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
  lines.push(['比賽',s.info.name,'組別',s.info.division,'場次',s.info.game,'日期',s.info.date,'開始',s.info.actual].map(q).join(','));
  lines.push(['A',nm[A],'B',nm[B]].map(q).join(','));
  lines.push('局,A得分,B得分,勝隊,分鐘,A暫停,B暫停,A替補,B替補');
  [1,2,3].forEach(function(n){var c=s.sets[n];if(!c.started)return;lines.push([n,c.score[A],c.score[B],c.winner?nm[c.winner]:'',setMin(c),c.timeouts[A].length,c.timeouts[B].length,c.subs[A].length,c.subs[B].length].map(q).join(','))});
  lines.push('');lines.push('時間,局,事件,隊伍,內容,A分,B分');
  var map={POINT:'得分',SERVE:'發球',REPLAY:'公正',TIMEOUT:'暫停',SUB:'替補',LIBERO_IN:'自由球員上場',LIBERO_OUT:'自由球員下場',LIBERO_SWAP:'自由球員互換',SANCTION:'判罰',INJURY:'傷停',INCOMPLETE:'陣容不完整',FORFEIT:'棄權',SIDES_SWAPPED:'換場',SET_STARTED:'開局',SET_ENDED:'局結束'};
  var KIND={IR:'不當請求',DW:'延誤警告',DP:'延誤懲罰',W:'黃牌警告',P:'紅牌懲罰',E:'出局',D:'出場'};
  var seen=[];
  m.events.forEach(function(e0){
    var e=pt[e0.id]?Object.assign({},e0,{data:Object.assign({},e0.data,pt[e0.id])}):e0;
    if(dead[e.id]||e.type==='UNDO')return;seen.push(e);
    if(!map[e.type])return;
    var st=reduce(seen),d=e.data,n=d.set||st.setNo,c=st.sets[n];
    var txt=e.type==='SUB'?d.out+' 換 '+d.in+(d.exc?'（例外）':''):e.type==='SANCTION'?KIND[d.kind]+' '+d.who:(e.type==='LIBERO_IN'||e.type==='LIBERO_SWAP')?'L'+d.lib:d.no||'';
    lines.push([hm(e.at),n,map[e.type],d.team?nm[d.team]:'',txt,c.score[A],c.score[B]].map(q).join(','));
  });
  return '﻿'+lines.join('\r\n');
}

      ['t1','t2'].forEach(function(x){if(ui.slot[x]&&ui.entry[x]!==''){commitNumber(x,s.teams[x])}ui.slot[x]=null;ui.entry[x]='';ui.msg[x]=''});
      var kind=b.getAttribute('data-kind'),t3=reduce(m.events).teams[k];
      if(no!==null&&!t3.players.some(function(p){return p.no===no}))break;
      if(no===null)ui.slot[k]={kind:kind,no:null,idx:kind==='lib'?t3.liberos.length:regularCount(t3)};
      else ui.slot[k]={kind:kind,no:no,idx:Number(b.getAttribute('data-i'))};
      ui.msg[k]='';
      break;
    case 'kpclose': commitNumber(k,t); ui.slot[k]=null; ui.entry[k]=''; ui.msg[k]=''; break;
    case 'sheet': ui.sheet={type:b.getAttribute('data-v'),team:k}; ui.pending=null; break;
    case 'pfreason': ui.sheet.reason=b.getAttribute('data-v'); break;
    case 'pfwin': ui.sheet.win=k; break;
    case 'pfdo': dispatch('PRE_FORFEIT',{winner:ui.sheet.win,reason:ui.sheet.reason}); ui.sheet=null; ui.page='play'; ui.rtab='note'; break;
    case 'fixset': ui.fixSet=Number(b.getAttribute('data-v')); break;
    case 'amendopen': ui.sheet={type:'amend',id:b.getAttribute('data-v')}; break;
    case 'amendask': ui.sheet.del=true; break;
    case 'amendback': ui.sheet.del=false; break;
    case 'amenddel': case 'amendto': case 'amendin': case 'amendout':
      var ae=s.log.filter(function(q){return q.id===ui.sheet.id})[0],av=Number(b.getAttribute('data-v')),ah='第 '+ae.set+' 局 '+ae.score+' '+tName(s,ae.team)+' ';
      if(act==='amenddel')dispatch('AMEND',{target:ae.id,del:true,note:ah+'刪除'+(ae.kind==='T'?'暫停':'替補 '+ae.out+' 換 '+ae.in)});
      else if(act==='amendto')dispatch('AMEND',{target:ae.id,patch:{team:other(ae.team)},note:ah+'暫停改為 '+tName(s,other(ae.team))});
      else if(act==='amendin')dispatch('AMEND',{target:ae.id,patch:{in:av},note:ah+'替補更正：'+ae.out+' 換 '+ae.in+' 改為 '+ae.out+' 換 '+av});
      else{var ano=s.sets[ae.set].lineups[ae.team][av];dispatch('AMEND',{target:ae.id,patch:{idx:av,out:ano},note:ah+'替補更正：'+ae.out+' 換 '+ae.in+' 改為 '+ano+' 換 '+ae.in})}
      ui.sheet=null; break;
    case 'fixopen': ui.sheet={type:'fix',team:k}; break;
    case 'fixpos': ui.sheet.pos=Number(b.getAttribute('data-v')); break;
    case 'fixno': ui.sheet.no=Number(b.getAttribute('data-v')); break;
    case 'fixback': if(ui.sheet.no!=null)ui.sheet.no=null; else ui.sheet.pos=null; break;
    case 'fixdo': dispatch('LINEUP_CORRECTED',{set:s.setNo,team:ui.sheet.team,pos:ui.sheet.pos,no:ui.sheet.no}); ui.sheet=null; break;
    case 'close': if(document.activeElement)document.activeElement.blur(); ui.sheet=null; ui.pending=null; break;
    case 'rm': dispatch('PLAYER_REMOVED',{team:k,no:no}); ui.slot[k]=null; ui.entry[k]=''; ui.msg[k]=''; break;
    case 'color': dispatch('TEAM_COLOR_SET',{team:k,color:b.getAttribute('data-v')}); break;
    case 'lcolor': dispatch('LIBERO_COLOR_SET',{team:k,color:b.getAttribute('data-v')||null}); break;
    case 'cap': dispatch('CAPTAIN_SET',{team:k,no:t.captain===no?null:no}); break;
    case 'lib':
      var on=t.liberos.indexOf(no)<0;
      if(on&&t.liberos.length>=MAX_LIBEROS){ui.msg[k]='自由球員最多 '+MAX_LIBEROS+' 名';break}
      if(!on&&regularCount(t)>=MAX_PLAYERS){ui.msg[k]='一般球員已滿 '+MAX_PLAYERS+' 人';break}
      ui.msg[k]=''; dispatch('LIBERO_SET',{team:k,no:no,on:on}); ui.slot[k]=null; break;
    case 'import-cancel': ui.pending=null; break;
    case 'import-pick':
    case 'import-yes':
      var list=pastTeams(m.id).filter(function(p){return p.name!==s.teams[other(k)].name.trim()});
      var pick=list[Number(b.getAttribute('data-i'))];
      if(!pick)break;
      if(act==='import-pick'&&t.players.length){ui.pending=pick.name;break}
      dispatch('TEAM_IMPORTED',{team:k,snapshot:pick.team,fromName:pick.name});
      ui.sheet=null; ui.pending=null; ui.slot[k]=null; ui.entry[k]=''; ui.msg[k]='';
      break;
    case 'toss':
      break;
    case 'ball': dispatch('TOSS_SET',{set:n,left:sideLeft(s),serve:k}); break;
    case 'swap': dispatch('TOSS_SET',{set:n,left:other(sideLeft(s))}); break;
    case 'cell': ui.sel={team:k,pos:Number(b.getAttribute('data-v'))}; break;
    case 'fill':
      dispatch('LINEUP_SET',{set:n,team:ui.sel.team,pos:ui.sel.pos,no:no});
      ui.sel=null; autoSelect(reduce(m.events)); break;
    case 'clearpos': dispatch('LINEUP_SET',{set:n,team:ui.sel.team,pos:ui.sel.pos,no:null}); break;
    case 'copy': dispatch('LINEUP_COPIED',{set:n,team:k}); ui.sel=null; autoSelect(reduce(m.events)); break;
    case 'gcap': dispatch('GAME_CAPTAIN_SET',{set:n,team:k,no:c.gameCaptain[k]===no?null:no}); break;
    case 'lu-lock': dispatch('LINEUP_LOCKED',{set:n,team:k}); var ls=reduce(m.events); if(!ls.sets[n].locked[other(k)])ui.luTeam=other(k); ui.sel=null; autoSelect(ls); break;
    case 'lu-copy': dispatch('LINEUP_COPIED',{set:n,team:k}); ui.sel=null; autoSelect(reduce(m.events)); break;
    case 'lu-unlock': dispatch('LINEUP_UNLOCKED',{set:n,team:k}); ui.sel=null; autoSelect(reduce(m.events)); break;
    case 'start': if(n===2){dispatch('SET_STARTED',{set:n}); ui.sel=null; ui.page='play'}else ui.cs=true; break;
    case 'cs-no': ui.cs=false; break;
    case 'cs-yes':
      var ti=document.getElementById('cs-time');
      if(ti){if(!ti.value)break;dispatch('INFO_SET',{field:'actual',value:ti.value})}
      ui.cs=false; dispatch('SET_STARTED',{set:n}); ui.sel=null; ui.page='play'; break;
    case 'nclose': ui.notice=null; break;
    case 'penopen': ui.pen={team:null,kind:null}; break;
    case 'injopen': ui.pen={team:null,kind:b.getAttribute('data-v')}; break;
    case 'penclose': if(ui.pen&&ui.pen.resume)ui.sub=ui.pen.resume; ui.pen=null; break;
    case 'penback': ui.pen.kind=null; break;
    case 'penteam': ui.pen.team=k; break;
    case 'penkind': ui.pen={team:k,kind:b.getAttribute('data-v'),resume:ui.sub}; ui.sub=null; break;
    case 'pendo': ui.pen.team=k; ui.pen.ok={kind:b.getAttribute('data-v'),who:'隊'}; break;
    case 'penwho': var wv=b.getAttribute('data-v'); ui.pen.ok={kind:ui.pen.kind,who:no===null?wv:no}; break;
    case 'penno': ui.pen.ok=null; break;
    case 'penyes':
      var pk=ui.pen.ok,who=pk.who,kd=pk.kind;k=ui.pen.team;no=typeof who==='number'?who:null;
      dispatch('SANCTION',{set:n,team:k,kind:kd,who:who}); ui.pen=null;
      if((kd==='E'||kd==='D')&&no!==null&&c.cur[k]&&c.cur[k].indexOf(no)>=0&&s.teams[k].liberos.indexOf(no)<0)ui.sub={team:k,idx:c.cur[k].indexOf(no),exc:false,ids:[],forced:true};
      break;
    case 'forceexc': ui.sub.exc=true; break;
    case 'injpick':
      dispatch('INJURY',{set:n,team:k,no:no}); ui.pen=null;
      ui.timer={team:k,end:Date.now()+180000,shown:true,closed:true,label:'傷停 '+no+' 號'}; break;
    case 'inc':
      dispatch('INCOMPLETE',{set:n,team:k,scope:b.getAttribute('data-v')}); ui.pen=null; ui.sub=null; ui.timer=null;
      if(!matchOver(reduce(m.events))){dispatch('SET_ADVANCED',{blank:true}); ui.luTeam=null; ui.page=reduce(m.events).setNo===2?'lineup':'toss'} else ui.page='play';
      break;
    case 'forfeit': dispatch('FORFEIT',{team:k}); ui.pen=null; ui.sub=null; ui.timer=null; ui.page='play'; break;
    case 'rtab': ui.rtab=b.getAttribute('data-v'); break;
    case 'fsopen':
      ui.fs=true;
      try{var fe=document.documentElement;if(fe.requestFullscreen){var fp=fe.requestFullscreen();if(fp&&fp.then)fp.then(function(){if(screen.orientation&&screen.orientation.lock)return screen.orientation.lock('landscape')}).catch(function(){})}}catch(err){}
      break;
    case 'fsclose':
      ui.fs=false;
      try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();if(document.fullscreenElement)document.exitFullscreen().catch(function(){})}catch(err){}
      break;
    case 'sheetopen': ui.liveSheet=true; ui.sub=null; ui.rtab='s'+s.setNo; break;
    case 'sheetclose': ui.liveSheet=false; ui.rtab=null; break;
    case 'report': ui.report=true; break;
    case 'rpclose': ui.report=false; break;
    case 'rpprint': window.print(); return;
    case 'rpcsv': saveFile(fname(s,'csv'),csvText(m,s),'text/csv;charset=utf-8'); return;
    case 'rpjson': saveFile(fname(s,'json'),JSON.stringify({app:'volleyball-scoresheet',version:1,match:m}),'application/json'); return;
    case 'rpcopy':
      var ms=document.getElementById('rvmsg'),txt=csvText(m,s);
      try{navigator.clipboard.writeText(txt).then(function(){ms.textContent='已複製 CSV'},function(){ms.textContent='無法複製'})}catch(er){ms.textContent='無法複製'}
      return;
    case 'serve': if(Date.now()<(ui.noServe||0))return; ui.lib=null; ui.sub=null; ui.timer=null; dispatch('SERVE',{set:n}); break;
    case 'replay': dispatch('REPLAY',{set:n}); break;
    case 'point': dispatch('POINT',{set:n,team:k}); break;
    case 'timeout': ui.toAsk=k; break;
    case 'tono': ui.toAsk=null; break;
    case 'toyes': k=ui.toAsk; ui.toAsk=null; dispatch('TIMEOUT',{set:n,team:k}); ui.timer={team:k,end:Date.now()+30000,shown:false,closed:false}; break;
    case 'tmclose': if(ui.timer)ui.timer.closed=true; break;
    case 'tmend': ui.timer=null; break;
    case 'libcell': ui.sub=null; ui.lib=(ui.lib&&ui.lib.no===no&&ui.lib.team===k)?null:{team:k,no:no}; break;
    case 'libout': ui.lib=null; dispatch('LIBERO_OUT',{set:n,team:k}); break;
    case 'ackl': ui.ackL[k]=b.getAttribute('data-v'); break;
    case 'subopen': ui.lib=null; ui.sub={team:k,idx:null,exc:b.getAttribute('data-m')==='exc',ids:[]}; break;
    case 'subcancel': (ui.sub.ids||[]).slice().reverse().forEach(function(id){dispatch('UNDO',{target:id})}); ui.sub=null; ui.noServe=Date.now()+700; break;
    case 'subclose':
      var cnt=c.subCount[ui.sub.team];
      if(!ui.sub.exc&&(ui.sub.ids||[]).length&&cnt>=5)ui.notice=tName(s,ui.sub.team)+' 第 '+cnt+' 次替補';
      ui.sub=null; ui.noServe=Date.now()+700; break;
    case 'subinj': ui.sub.inj=!ui.sub.inj; break;
    case 'subin': dispatch('SUB',{set:n,team:k,idx:ui.sub.idx,out:c.cur[k][ui.sub.idx],in:no,exc:ui.sub.exc,injury:!!(ui.sub.exc&&ui.sub.inj)}); ui.sub.ids.push(m.events[m.events.length-1].id); ui.sub.idx=null; break;
    case 'gcappick': ui.sheet={type:'gcap',team:k}; break;
    case 'capmode':
      var cn=b.getAttribute('data-v');
      dispatch('INFO_SET',{field:'c'+cn,value:b.getAttribute('data-m')==='on'?(capOf(s,Number(cn))||target(s,Number(cn))+2):''});
      break;
    case 'lurot': dispatch('LINEUP_ROTATED',{set:n,team:k,dir:b.getAttribute('data-v')}); ui.sel=null; break;
    case 'gcset': dispatch('GAME_CAPTAIN_SET',{set:n,team:k,no:no}); ui.sheet=null; break;
    case 'pcell':
      var ix=Number(b.getAttribute('data-v'));
      if(ui.sub){ui.sub.idx=ix;break}
      if(ui.lib){
        if(c.libOut[k]&&s.teams[k].liberos.indexOf(c.cur[k][ix])>=0)dispatch('LIBERO_SWAP',{set:n,team:k,lib:ui.lib.no});
        else if(c.libOut[k]){ui.lib=null;break}
        else dispatch('LIBERO_IN',{set:n,team:k,lib:ui.lib.no,idx:ix});
        ui.lib=null;
      }
      break;
    case 'undo': ui.rtab=null; var last=lastUndoable(m); if(last){dispatch('UNDO',{target:last.id}); if(last.type==='TIMEOUT')ui.timer=null; if(last.type==='SET_STARTED'){ui.page='lineup';ui.sel=null;ui.luTeam=null}} break;
    case 'swap8': dispatch('SIDES_SWAPPED',{set:n}); break;
    case 'endset':
      dispatch('SET_ENDED',{set:n,winner:k});
      var after=reduce(m.events);
      if(!matchOver(after)){dispatch('SET_ADVANCED',{blank:true}); ui.luTeam=null; ui.lib=null; ui.sub=null; ui.page=reduce(m.events).setNo===2?'lineup':'toss'}
      ui.rtab=null;
      break;
    default: return;
  }
  render();
});
function commitNumber(k,t){
  var raw=ui.entry[k],sl=ui.slot[k];
  if(raw==='')return true;
  var n=Number(raw),old=sl.no;
  if(t.players.some(function(p){return p.no===n&&p.no!==old})){ui.msg[k]=n+' 號已在名單上';ui.entry[k]='';return false}
  if(old!==null){
    if(n!==old)dispatch('PLAYER_NUMBER_CHANGED',{team:k,from:old,to:n});
  }else{
    dispatch('PLAYER_ADDED',{team:k,no:n});
    if(sl.kind==='lib')dispatch('LIBERO_SET',{team:k,no:n,on:true});
  }
  ui.entry[k]=''; ui.msg[k]='';
  ui.slot[k]=(old===null&&sl.kind==='reg')?autoSlot(reduce(current().events).teams[k]):null;
  return true;
}

function makeSample(){
  var info=defaultInfo(); info.game='範例'; info.division='男子組';
  var m=createMatch(info);
  [['t1','範例紅隊',[1,3,5,7,9,11,12,18],3,[12]],['t2','範例藍隊',[2,4,6,8,10,14,15,20,77],6,[15,20]]].forEach(function(c){
    dispatch('TEAM_NAME_SET',{team:c[0],value:c[1]},m);
    c[2].forEach(function(n){dispatch('PLAYER_ADDED',{team:c[0],no:n},m)});
    dispatch('CAPTAIN_SET',{team:c[0],no:c[3]},m);
    c[4].forEach(function(n){dispatch('LIBERO_SET',{team:c[0],no:n,on:true},m)});
  });
}

render();
})();
</script>
