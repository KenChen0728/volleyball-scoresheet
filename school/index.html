<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);overflow:hidden}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-weight:700;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active:not(:disabled){filter:brightness(.92)}

.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800;min-height:56px;font-size:19px}

.muted{color:var(--muted);font-size:15px}
.err{color:var(--bad);font-weight:700;min-height:22px}
input{width:100%;min-height:46px;padding:0 10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);font-size:16px}
label{display:flex;flex-direction:column;gap:3px;font-size:15px;color:var(--muted)}
.statusband{position:fixed;top:0;left:0;right:0;height:var(--safe-top);background:var(--brand);z-index:99;pointer-events:none}
.bar{flex:none;display:flex;align-items:center;gap:8px;min-height:54px;padding:calc(var(--safe-top) + 5px) max(12px,env(safe-area-inset-right,0px)) 5px max(12px,env(safe-area-inset-left,0px));background:var(--brand);color:#fff}

.bar button:focus-visible{outline-color:#FFD21F}
.q{width:44px;padding:0!important;border-radius:50%;font-size:18px!important}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

.seg button[aria-pressed=true]{background:var(--brand);color:#fff}

.page{flex:1;min-height:0;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + var(--safe-bot)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.wrap{width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.wrap.wide{max-width:980px}
/* 主畫面 */
.hero{flex:none;background:var(--brand);color:#fff;padding:calc(var(--safe-top) + 26px) 22px 22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hero>*{position:relative;width:100%;max-width:640px;margin:0 auto}
.hero h1{font-size:clamp(38px,11vw,64px);line-height:1.08;font-weight:900}
.hero p{color:rgba(255,255,255,.88)}
.hero .ballbg{position:absolute;right:-50px;top:calc(var(--safe-top) - 10px);width:190px;height:190px;max-width:none;margin:0;opacity:.95}
.hero .ballbg svg{width:100%;height:100%;display:block}
.hero p,.hero h1{padding-right:96px}
.hero .primary{min-height:62px;font-size:21px;margin-top:6px;border-radius:12px}
.herolinks{display:flex;gap:22px;flex-wrap:wrap}
.herolinks .link{min-height:44px}
.homebody{flex:1;min-height:0;overflow:auto;padding:16px 16px calc(16px + var(--safe-bot))}
.homebody .wrap{gap:18px}
.homebody h2{font-size:18px;font-weight:800}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row2 .main{display:block;text-align:left;background:none;border:0;padding:4px 0;min-width:0}
.row2 strong{display:block;overflow-wrap:anywhere}
.row2 .main .muted{font-weight:500}
.pill{display:inline-block;font-size:13px;padding:0 7px;border-radius:4px;background:var(--soft);color:var(--muted);vertical-align:2px}
.foot{font-size:13px;color:var(--muted);text-align:center;line-height:1.7}
.warn{background:#FDF0CC;color:#6E4700;padding:10px 12px;border-radius:var(--r);font-size:15px}
.warn a{color:inherit;font-weight:800}
.offok{text-align:center;color:var(--ok);font-weight:700;font-size:14px}
/* 新比賽 */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:6px}
.swatches button{min-height:44px;padding:0;background:var(--j);color:var(--jt);font-size:14px}
.swatches button[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:1px}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
/* 開局 */
.toss{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:8px;align-items:stretch}
.tossb{min-height:64px;padding:6px;background:var(--j);color:var(--jt);border:3px solid var(--line);overflow-wrap:anywhere;line-height:1.2}
.tossb small{display:block;font-size:14px;font-weight:700;min-height:20px}
.tossb[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.tossb:disabled{opacity:1}
.court{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) 6px repeat(2,minmax(0,1fr));gap:4px;min-height:0}
.colh{font-size:13px;font-weight:700;color:var(--muted);text-align:center;line-height:18px}
.net{grid-column:3;background:var(--ink);border-radius:2px}
button.lubtn{position:relative;height:68px;width:100%;padding:0;background:var(--j);color:var(--jt);border:2px solid var(--line)}
.lubtn span{position:absolute;left:6px;top:3px;font-size:13px}
.lubtn b{font:700 32px var(--num)}
.lubtn.first{border-color:var(--accent)}
.lubtn.on{outline:4px solid var(--ink);outline-offset:1px}
.rteam{display:flex;flex-direction:column;gap:6px;min-width:0}
.rname{background:var(--j);color:var(--jt);border-radius:8px;padding:8px;font-weight:800;text-align:center;overflow-wrap:anywhere}
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rgrid input{text-align:center;font:700 22px var(--num);padding:0}

.play{flex:1;min-height:0;display:grid;gap:8px;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + var(--safe-bot)) max(10px,env(safe-area-inset-left,0px));grid-template:auto minmax(0,1fr)/repeat(2,minmax(0,1fr));grid-template-areas:"a b" "c c"}
.teamA{grid-area:a}.teamB{grid-area:b}.courtw{grid-area:c;display:flex;flex-direction:column;gap:4px;min-height:0}
.team{min-width:0;display:flex;flex-direction:column;gap:6px}
.thead{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.tname{font-size:17px;font-weight:800;min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.2}
.sc{font:700 clamp(50px,15vw,84px)/.95 var(--num)}
.setw{font:700 22px var(--num);color:var(--muted);white-space:nowrap}
.info{font-size:15px;font-weight:700;min-height:22px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info.srv{color:var(--ok)}
.pt{min-height:68px;font-size:22px;font-weight:800;background:var(--j);color:var(--jt);border:0;box-shadow:inset 0 0 0 1px rgba(128,140,150,.5);border-radius:12px}
.tbtns{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.tbtns button{font-size:16px;padding:0 4px}
.tbtns button.dim{opacity:.5}
.courtw .court{flex:1;grid-template-rows:18px repeat(3,minmax(0,1fr));width:100%;max-width:640px;margin:0 auto}
.cellbtn{position:relative;min-height:0;height:100%;padding:0;border:0;border-radius:6px;background:var(--j);color:var(--jt);box-shadow:inset 0 0 0 1px rgba(128,140,150,.5);display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:0}
.cellbtn b{font:700 clamp(30px,8vw,48px)/1 var(--num)}
.cellbtn .pos{position:absolute;left:5px;top:2px;font-size:13px;font-weight:700;opacity:.85}
.cellbtn .ballm{position:absolute;right:9px;top:9px;width:26px;height:26px}
.cellbtn .ballm svg{display:block;width:100%;height:100%}
.cellbtn.srv .pos{left:11px;top:9px;color:var(--jt);opacity:1}
.cellbtn.srv .tag{bottom:9px}
.cellbtn.srv{outline:4px solid var(--accent);outline-offset:-4px;box-shadow:inset 0 0 0 7px #12324F}
.cellbtn .tag{position:absolute;left:4px;right:4px;bottom:3px;text-align:center;font-size:clamp(14px,2.6vh,18px);font-weight:800;white-space:nowrap;overflow:hidden}
.cellbtn.lib{box-shadow:inset 0 0 0 3px var(--jt)}
.cellbtn.bound .tag{text-decoration:underline}
.hint{text-align:center;font-size:14px;color:var(--muted);min-height:20px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;top:calc(var(--safe-top) + 62px);transform:translateX(-50%);z-index:30;max-width:calc(100% - 24px);padding:8px 14px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:700;text-align:center;pointer-events:none}
.timer{position:fixed;left:50%;top:calc(var(--safe-top) + 58px);transform:translateX(-50%);z-index:25;display:flex;align-items:center;gap:10px;padding:4px 6px 4px 14px;border-radius:10px;background:var(--j);color:var(--jt);box-shadow:0 4px 16px rgba(0,0,0,.35);white-space:nowrap;font-weight:800}
.timer b{font:700 32px/1 var(--num)}
.timer button{background:#fff;color:#141414;border-color:#fff;padding:0 10px}
/* 面板 */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;overflow:auto;background:var(--panel);border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + var(--safe-bot)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 30px rgba(0,0,0,.32)}
.sheet h2{font-size:20px;font-weight:800}
.sheet .full{width:100%}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.keys button{min-height:50px;font:700 24px var(--num)}
.entry{text-align:center;font:700 40px/48px var(--num);min-height:48px;border-bottom:2px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-width:56px;min-height:48px;font:700 22px var(--num)}
.sheet .sub2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:760px){.sheet{left:auto;top:0;width:380px;max-height:none;border-radius:14px 0 0 14px;padding-top:calc(16px + var(--safe-top))}.sheet.center{top:auto;bottom:50%;right:50%;transform:translate(50%,50%);width:440px;border-radius:14px;padding-top:16px}}
.res{width:100%;border-collapse:collapse}
.res th,.res td{border:1px solid var(--line);padding:8px 4px;text-align:center}
.res td{font:700 22px var(--num)}
.res th{font-size:15px}
.result{font-size:26px;font-weight:900;text-align:center}
/* 說明 */
.help{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding:calc(10px + var(--safe-top)) 16px calc(12px + var(--safe-bot))}
.help>*{width:100%;max-width:860px;margin-left:auto;margin-right:auto}
.hhead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800}
.hhead span{flex:1;text-align:center}
.hmenu{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.hmenu button{flex:none;display:block;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 2px;min-height:68px}
.hmenu strong{display:block;font-size:17px}
.hmenu small{font-size:15px;color:var(--muted);font-weight:500}
.htrack{flex:1;min-height:0;display:flex;gap:24px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.htrack::-webkit-scrollbar{display:none}
.hslide{flex:0 0 100%;min-width:0;display:flex;flex-direction:column;gap:10px;scroll-snap-align:start;scroll-snap-stop:always}
.himg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.himg img{max-width:100%;max-height:100%;border-radius:8px;display:block;border:1px solid var(--line)}
.hslide.noimg{justify-content:center}
.hslide.noimg .himg{display:none}
.hslide h2{font-size:21px}
.hslide p{font-size:16px;line-height:1.5}
.hfoot{flex:none;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.hfoot span{color:var(--muted);font-size:15px}
.stale{position:fixed;inset:0;z-index:98;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
/* 橫向：左隊、球場、右隊，平板綁在球柱上時的主要畫面 */
@media (orientation:landscape) and (min-width:640px){
  .play{grid-template:minmax(0,1fr)/minmax(150px,240px) minmax(0,1fr) minmax(150px,240px);grid-template-areas:"a c b"}
  .sc{font-size:clamp(64px,16vh,120px)}
  .team .pt{flex:1;min-height:60px;max-height:190px;font-size:26px}
  .tbtns{margin-top:auto}
  .tname{font-size:19px}
  .courtw .court{max-width:none}
  .cellbtn b{font-size:clamp(34px,10vh,64px)}
}
@media (orientation:landscape) and (min-width:640px) and (max-height:460px){
  .bar{min-height:46px;padding-top:2px;padding-bottom:2px}.bar button{min-height:40px}
  .team{gap:3px}.tname{font-size:15px;-webkit-line-clamp:1}.sc{font-size:48px}.info{font-size:14px}.team .pt{min-height:46px;font-size:20px}
  .play{padding-top:4px;padding-bottom:calc(4px + var(--safe-bot));gap:6px}.tbtns button{min-height:40px}
}
@media (orientation:landscape) and (min-width:640px) and (max-width:900px){.play{grid-template-columns:118px minmax(0,1fr) 118px}.team .thead:nth-child(2) .muted{font-size:13px}}
@media (orientation:landscape) and (max-height:520px){
  .hero{padding-top:12px;padding-bottom:12px}.hero h1{font-size:34px}.hero .ballbg{display:none}
  .sheet{max-height:100%}button.lubtn{height:52px}
  .himg{display:none}
}
@media (orientation:portrait) and (max-height:700px){.pt{min-height:56px}.sc{font-size:46px}}
@media (min-width:1500px){.wrap.wide{max-width:1100px}}
/* 主畫面 App 的上下邊，做法同排球電子記錄表 */
@media (display-mode:standalone){
  :root{--safe-top:calc(env(safe-area-inset-top,0px) + min(40px,calc(env(safe-area-inset-top,0px)*99)))}
  html{background:var(--brand);color-scheme:dark}
}
@supports (height:100lvh){@media (display-mode:standalone){
  :root{--app-h:min(100lvh,calc(100dvh + env(safe-area-inset-top,0px)*99));--vgap:calc(var(--app-h) - 100dvh)}
  html,body,#app{height:var(--app-h)}
  html,body{overflow:visible}#app{overflow:hidden}
  .help,.scrim,.sheet,.stale{bottom:calc(0px - var(--vgap))!important}
}}
@media (display-mode:standalone) and (orientation:landscape) and (max-height:500px){.statusband{display:none}}
@media (prefers-reduced-motion:reduce){.htrack{scroll-behavior:auto}}
</style>

var JERSEY=[['red','紅','#D3122F'],['orange','橘','#F07A1A'],['yellow','黃','#F7CE1E'],['green','綠','#1C9A57'],['blue','藍','#1E7BD6'],['navy','深藍','#16245E'],['purple','紫','#6F2DB0'],['pink','粉','#EE5FA7'],['black','黑','#141414'],['gray','灰','#8C9493'],['white','白','#FFFFFF']];
function jhex(id){return (JERSEY.filter(function(x){return x[0]===id})[0]||JERSEY[4])[2]}
function jtext(hex){function lum(c){var h=parseInt(c.slice(1),16);return [h>>16,(h>>8)&255,h&255].reduce(function(a,v,i){v/=255;v=v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);return a+v*[.2126,.7152,.0722][i]},0)}var L=lum(hex),d=lum('#141414');return (L+.05)/(d+.05)>1.05/(L+.05)?'#141414':'#FFFFFF'}
function jstyle(s,k){var h=jhex(s.info[k==='t1'?'c1':'c2']);return '--j:'+h+';--jt:'+jtext(h)+';--jb:'+h}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function other(k){return k==='t1'?'t2':'t1'}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function load(){try{lastRaw=localStorage.getItem(KEY);if(lastRaw){var d=JSON.parse(lastRaw);if(d&&Array.isArray(d.matches))return d}else{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t')}}catch(e){memOnly=true}return {matches:[],cur:null}}

function save(){if(stale)return;try{var now=localStorage.getItem(KEY);if(now!==null&&now!==lastRaw){stale=true;return}var o=JSON.stringify(db);localStorage.setItem(KEY,o);lastRaw=o;memOnly=false}catch(e){memOnly=true}}
addEventListener('storage',function(e){if(e.key===KEY&&e.newValue!==lastRaw){stale=true;render()}});
function current(){return db.matches.filter(function(m){return m.id===db.cur})[0]||null}

function teamNo(s,k){return s.info[k]||(k==='t1'?'隊伍一':'隊伍二')}
function newSet(n,d){return {n:n,left:d.left,serve:d.serve,serving:d.serve,lu:d.lu,cur:{t1:d.lu.t1.slice(),t2:d.lu.t2.slice()},lib:d.lib,rot:{t1:0,t2:0},score:{t1:0,t2:0},to:{t1:0,t2:0},subs:{t1:0,t2:0},bind:{t1:{},t2:{}},libOut:{t1:null,t2:null},swapped:false,ended:false,winner:null}}
function posOfIdx(c,k,idx){return (idx-c.rot[k]+6)%6}
function reduce(m){
  var s={info:m.info,sets:[],won:{t1:0,t2:0},auto:null,roster:m.info.roster?JSON.parse(JSON.stringify(m.info.roster)):null},c=null;
  m.ev.forEach(function(e,i){var d=e.d,k=d.k;
    s.auto=null;
    switch(e.t){
      case 'SET': c=newSet(s.sets.length+1,d);s.sets.push(c);break;
      case 'POINT':
        c.score[k]++;
        if(c.serving!==k){c.serving=k;c.rot[k]=(c.rot[k]+1)%6;
          var o=c.libOut[k];
          if(o){var p=posOfIdx(c,k,o.idx);if(p>=1&&p<=3){s.auto={k:k,lib:c.cur[k][o.idx],no:o.no};c.cur[k][o.idx]=o.no;c.libOut[k]=null}} // 自由球員轉到前排：自動換回
        }break;
      case 'TO': c.to[k]++;break;
      case 'RADD': s.roster[k].p.push(d.no);break;
      case 'SUB':
        var b=c.bind[k][d.idx];
        c.cur[k][d.idx]=d.in;c.subs[k]++;
        if(b!=null&&b===d.in)delete c.bind[k][d.idx]; // 換回來：這組完成，兩人都解除綁定
        else c.bind[k][d.idx]=d.out;
        break;
      case 'LIBIN': c.libOut[k]={no:c.cur[k][d.idx],idx:d.idx};c.cur[k][d.idx]=d.lib;break;
      case 'LIBOUT': var q=c.libOut[k];c.cur[k][q.idx]=q.no;c.libOut[k]=null;break;
      case 'LIBSWAP': c.cur[k][c.libOut[k].idx]=d.lib;break;
      case 'SWAP': c.left=other(c.left);c.swapped=true;break;
      case 'END': c.ended=true;c.winner=winnerOf(s,c);s.won[c.winner]++;break;
    }
  });
  s.c=c;return s;
}
function isDecide(s,n){return n===s.info.fmt}
function target(s,n){return isDecide(s,n)?s.info.dpts:s.info.pts}
function need(s){return (s.info.fmt+1)/2}
function winnerOf(s,c){var a=c.score.t1,b=c.score.t2,t=target(s,c.n);return Math.max(a,b)>=t&&Math.abs(a-b)>=2?(a>b?'t1':'t2'):null}
function over(s){return s.won.t1>=need(s)||s.won.t2>=need(s)}
function needSwap(s){var c=s.c;return c&&!c.ended&&!winnerOf(s,c)&&isDecide(s,c.n)&&!c.swapped&&Math.max(c.score.t1,c.score.t2)>=Math.ceil(target(s,c.n)/2)}
function phase(s){if(!s.roster||ui.editRoster)return 'roster';if(over(s))return 'over';if(!s.c||s.c.ended)return 'set';return 'play'}
function waiting(c,k){return Object.keys(c.bind[k]).map(function(i){return c.bind[k][i]})}
/* 這個背號可不可以上場：不能的話回傳原因 */
function subProblem(c,k,idx,no){
  if(no===''||no==null||isNaN(no))return '請輸入背號';
  if(c.cur[k].indexOf(no)>=0)return no+' 號已經在場上';
  if(c.lib[k].indexOf(no)>=0)return no+' 號是自由球員，不能用替補上場';
  if(c.libOut[k]&&c.libOut[k].no===no)return no+' 號被自由球員換下，要先換回';
  var w=null;Object.keys(c.bind[k]).forEach(function(i){if(c.bind[k][i]===no&&Number(i)!==idx)w=i});
  if(w!==null)return no+' 號綁定中，只能換回 '+c.cur[k][w]+' 號那個位置';
  return '';
}

function setDraft(s){
  var prev=s.sets[s.sets.length-1],n=s.sets.length+1,decide=isDecide(s,n);
  if(ui.draft&&ui.draft.n===n)return ui.draft;
  var d={n:n,left:'t1',serve:null,lu:{t1:[null,null,null,null,null,null],t2:[null,null,null,null,null,null]},pick:null};
  if(prev){d.left=other(prev.left);d.serve=decide?null:other(prev.serve);['t1','t2'].forEach(function(k){d.lu[k]=prev.lu[k].filter(function(){return true}).map(function(no){return s.roster[k].p.indexOf(no)>=0?no:null})})}
  if(current().info.sample&&!prev){d.serve='t1';d.lu={t1:s.roster.t1.p.slice(0,6),t2:s.roster.t2.p.slice(0,6)}}
  nextPick(d);ui.draft=d;return d;
}
function nextPick(d){var L=d.left,o=[L,other(L)],r=null;if(d.pick&&d.lu[d.pick.k].indexOf(null)>=0){var k=d.pick.k;for(var i=1;i<=6;i++){var p=(d.pick.pos+i)%6;if(d.lu[k][p]===null){d.pick={k:k,pos:p};return}}}o.some(function(k){var p=d.lu[k].indexOf(null);if(p>=0){r={k:k,pos:p};return true}});d.pick=r}

  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,v=b.dataset.v,k=b.dataset.k,m=current();
  if(b.hasAttribute('data-g')&&Date.now()-(ui.sheetAt||0)<800)return; // 賽末點連按不會直接按到確定
  switch(a){
    case 'reload':location.reload();return;

    case 'leave':view='home';db.cur=null;stopTimer();save();toast('比賽還在，放在「進行中」');break;

      ev('TO',{k:k});timer={k:k,end:Date.now()+30000};clearInterval(tick);tick=setInterval(function(){var l=document.getElementById('tl'),r=Math.ceil((timer.end-Date.now())/1000);if(r<=0){stopTimer();render();return}if(l)l.textContent=r},250);break;
    case 'toend':stopTimer();break;
    case 'undo':
      if(!m.ev.length)break;
      var last=m.ev.pop();stopTimer();ui.sub=null;ui.flip=last.t==='POINT';ui.draft=null;save();
      toast({POINT:'已復原得分',RADD:'已復原',TO:'已復原暫停',SUB:'已復原替補',SET:'已回到開局',END:'已回到上一局',SWAP:'已復原換場',LIBIN:'已復原自由球員',LIBOUT:'已復原自由球員',LIBSWAP:'已復原自由球員'}[last.t]);

      break;
    case 'end':ev('END');ui.draft=null;break;
    case 'swap':ev('SWAP');break;
    case 'cell':ui.sub={k:k,idx:Number(v),no:'',err:''};break;
    case 'close':ui.sub=null;break;
    case 'key':keyTap(v);return;
    case 'subgo':subGo();return;
    case 'subpick':subDo(ui.sub.k,ui.sub.idx,Number(v));return;
    case 'subback':subDo(ui.sub.k,ui.sub.idx,Number(v));return;
    case 'force':ui.sub.force=true;break;
    case 'ext':ui.sub.ext=true;break;
    case 'libin':ev('LIBIN',{k:ui.sub.k,idx:ui.sub.idx,lib:Number(v)});ui.sub=null;break;
    case 'libout':ev('LIBOUT',{k:ui.sub.k});ui.sub=null;break;
    case 'libswap':ev('LIBSWAP',{k:ui.sub.k,lib:Number(v)});ui.sub=null;break;
    case 'help':ui.help={t:v||null,i:0};break;
    case 'helpt':ui.help={t:v,i:0};break;
    case 'helpm':ui.help={t:null,i:0};break;
    case 'helpx':ui.help=null;break;
    case 'hprev':helpGo(-1);return;
    case 'hnext':if(document.getElementById('hn').textContent==='看完了'){ui.help={t:null,i:0};break}helpGo(1);return;
  }
  render();
});
