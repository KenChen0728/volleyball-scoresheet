<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12324F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Score Sheet">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" href="../icons/icon-192.png">
<meta name="description" content="美國學校排球賽用的記分工具。按得分，輪轉和發球自動處理，可以離線使用。">
<meta property="og:type" content="website">
<meta property="og:title" content="Volleyball Score Sheet">

<title>Volleyball Score Sheet（測試版）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面概念：整頁固定一個畫面不上下滑。手機用底部分頁，平板用側邊分頁，細節用浮動面板。
   系統字型為刻意選擇：比賽現場可能沒有網路，不能依賴線上字型。 */
:root{
  --bg:#ECE8E1; --panel:#F7F5F1; --ink:#2C2925; --muted:#5E584F; --line:#D5CFC5; --soft:#E2DDD5; --line2:#CBC4B8;
  --t1:#0A5AA8; --t1-soft:#DCEAF7; --t1-on:#FFFFFF; --t2:#B8420B; --t2-soft:#FBE6DA; --t2-on:#FFFFFF;
  --ok:#0B6E43; --ok-soft:#D9F0E4; --warn:#8A5A00; --warn-soft:#FDF0CC; --bad:#B3261E; --bad-soft:#FBE4E2;
  --on-accent:#2C2925; --scrim:rgba(44,38,32,.42); --del:#9E4A3F;--del-ink:#9E4A3F; --del-on:#FFFFFF;
  --brand:#F4F1EC; --box:#56616B; --accent:#F2C14B; --accent-ink:#2C2925; --sel:#3B3833; --sel-on:#F7F5F1;
  /* 11/12 霧灰：一般按鈕、不能按、版頭、主畫面、面板、卡片 */
  --btn:#E2DDD4; --btn-edge:transparent; --btn-ink:#2C2925; --off:#EFEBE5; --off-edge:#C4BCB0; --off-ink:#8A8378;
  --field:#FBFAF7; --field-edge:#D5CFC5; --accent-shadow:0 1px 0 rgba(90,70,20,.12); --track:#E2DDD4;
  --hdr-ink:#2C2925; --hdr-sub:#5E584F; --hdr-btn:rgba(44,41,37,.07); --hdr-mute:rgba(44,41,37,.3);
  --hero:#E2DCD2; --hero-ink:#2C2925; --hero-sub:#5F594F; --hero-btn:rgba(44,41,37,.08); --hero-line:rgba(44,41,37,.09);
  --sheet:#F7F5F1; --sheet-shadow:0 -12px 40px rgba(44,38,32,.22); --card:#F7F5F1; --card-shadow:0 1px 2px rgba(60,50,40,.07);
  --net:#3B3833; --faint:#A39B8F; --paper-shadow:0 1px 3px rgba(60,50,40,.14); --note:#E4DDCF; --note-ink:#5A4F3E;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"Avenir Next Condensed","DIN Alternate","Bahnschrift","Roboto Condensed","sans-serif-condensed","Arial Narrow",var(--font);
  --r:9px; --rb:9px; --rc:12px; --rs:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1C1A; --panel:#262523; --ink:#ECE8E1; --muted:#ADA69B; --line:#413E39; --soft:#302E2B; --line2:#4C4842;
  --t1:#6FB3F2; --t1-soft:#17324B; --t2:#F59A63; --t2-soft:#44260F;
  --ok:#5FD39A; --ok-soft:#123A2C; --warn:#EDB95E; --warn-soft:#3C2C0D; --bad:#F2918A; --bad-soft:#47201D;
  --on-accent:#2A2723; --scrim:rgba(0,0,0,.55); --del:#B4594D;--del-ink:#E58A7E; --del-on:#FFFFFF; --brand:#272624; --box:#3D444B; --sel:#E8E3DB; --sel-on:#1D1C1A; --sheet-dim:.9; --cs:dark; color-scheme:dark;
  --accent:#F0C24E; --accent-ink:#2A2723; --accent-shadow:none;
  --btn:#3A3733; --btn-ink:#ECE8E1; --off:#232220; --off-edge:#4C4842; --off-ink:#7C766C; --field:#232220; --field-edge:#45423C; --track:#2D2B28;
  --hdr-ink:#ECE8E1; --hdr-sub:#ADA69B; --hdr-btn:rgba(255,255,255,.08); --hdr-mute:rgba(255,255,255,.28);
  --hero:#2A2826; --hero-ink:#ECE8E1; --hero-sub:#BDB6AB; --hero-btn:rgba(255,255,255,.09); --hero-line:rgba(255,255,255,.06);
  --sheet:#2A2926; --sheet-shadow:0 -12px 40px rgba(0,0,0,.5); --card:#272624; --card-shadow:none;
  --net:#D8D2C8; --faint:#6F695F; --paper-shadow:none; --note:#34302A; --note-ink:#D9CFBE;
}}
:root[data-theme="dark"]{
  --bg:#1D1C1A; --panel:#262523; --ink:#ECE8E1; --muted:#ADA69B; --line:#413E39; --soft:#302E2B; --line2:#4C4842;
  --t1:#6FB3F2; --t1-soft:#17324B; --t2:#F59A63; --t2-soft:#44260F;
  --ok:#5FD39A; --ok-soft:#123A2C; --warn:#EDB95E; --warn-soft:#3C2C0D; --bad:#F2918A; --bad-soft:#47201D;
  --on-accent:#2A2723; --scrim:rgba(0,0,0,.55); --del:#B4594D;--del-ink:#E58A7E; --del-on:#FFFFFF; --brand:#272624; --box:#3D444B; --sel:#E8E3DB; --sel-on:#1D1C1A; --sheet-dim:.9; --cs:dark; color-scheme:dark;
  --accent:#F0C24E; --accent-ink:#2A2723; --accent-shadow:none;
  --btn:#3A3733; --btn-ink:#ECE8E1; --off:#232220; --off-edge:#4C4842; --off-ink:#7C766C; --field:#232220; --field-edge:#45423C; --track:#2D2B28;
  --hdr-ink:#ECE8E1; --hdr-sub:#ADA69B; --hdr-btn:rgba(255,255,255,.08); --hdr-mute:rgba(255,255,255,.28);
  --hero:#2A2826; --hero-ink:#ECE8E1; --hero-sub:#BDB6AB; --hero-btn:rgba(255,255,255,.09); --hero-line:rgba(255,255,255,.06);
  --sheet:#2A2926; --sheet-shadow:0 -12px 40px rgba(0,0,0,.5); --card:#272624; --card-shadow:none;
  --net:#D8D2C8; --faint:#6F695F; --paper-shadow:none; --note:#34302A; --note-ink:#D9CFBE;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);font-variant-numeric:tabular-nums;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:1200px;margin:0 auto}
h1,h2,h3,p,ul{margin:0;padding:0}
h1{font-size:18px}
h2{font-size:17px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);min-height:46px;padding:0 12px;font-weight:600}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
input{width:100%;min-height:46px;padding:0 10px;font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
input:disabled{background:var(--soft);color:var(--muted)}
input[type="date"],input[type="time"]{-webkit-appearance:none;appearance:none;display:flex;align-items:center;height:46px;line-height:44px;padding-top:0;padding-bottom:0;min-width:0;max-width:100%;text-align:left}
input::-webkit-date-and-time-value{text-align:left;line-height:44px;min-height:44px;margin:0;padding:0}
.fields>label{overflow:hidden}
label{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--muted);min-width:0}
.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.go{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.danger,.pad button.back,.bench .chip.blank.clear,.chip.blank.clear,button.danger{background:var(--del);border-color:var(--del);color:var(--del-on)}
.kphead .go{min-width:64px}
.ghost{background:transparent}
.muted{color:var(--muted);font-size:14px}
.warning{background:var(--warn-soft);color:var(--warn);padding:10px 12px;border-radius:var(--r);font-size:14px}
.note{background:var(--soft);padding:10px 12px;border-radius:var(--r);font-size:14px}
.good{background:var(--ok-soft);color:var(--ok);padding:10px 12px;border-radius:var(--r);font-weight:600;font-size:15px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1 1 0;min-width:0}

/* 外框 */
.bar{flex:none;display:flex;align-items:center;gap:8px;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.bar h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{min-height:38px;font-size:14px}
.shell{flex:1;min-height:0;display:flex;flex-direction:column}
.page{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-block:2px 8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.nav{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{border:0;border-radius:0;background:transparent;min-height:58px;padding:4px 2px;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;border-top:3px solid transparent}
.nav button span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav small{font-weight:500;color:var(--muted);font-size:11px}
.nav small.done{color:var(--ok)}
.nav button[aria-current="true"]{border-top-color:var(--ink);background:var(--soft)}
@media (min-width:760px){
  .shell{flex-direction:row-reverse}
  .nav{width:128px;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-left:env(safe-area-inset-left,0px)}
  .nav button{flex:1;max-height:96px;font-size:15px;border-top:0;border-left:4px solid transparent}
  .nav button[aria-current="true"]{border-left-color:var(--ink)}
}

/* 比賽列表、資料 */
.match{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.match .t{min-width:0;flex:1 1 200px}
.match strong{display:block;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:0 7px;border-radius:4px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fields .wide{grid-column:1/-1}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* 隊伍頁 */
.teampage{--c:var(--t1);--s:var(--t1-soft);--o:var(--t1-on)}
.teampage.t2{--c:var(--t2);--s:var(--t2-soft);--o:var(--t2-on)}
.nameline{display:flex;gap:6px;align-items:flex-end}
.nameline>div{flex:1;min-width:0}
.swatch{padding:0;background:var(--j);border:2px solid var(--line)}
.nameline button{font-size:14px;padding:0 10px}
.nameline label{font-size:0;gap:0}
.split{flex:none;display:flex;flex-direction:column;gap:8px}
.foot{flex:none;display:flex;flex-direction:column;gap:6px;margin-top:auto}
.full{width:100%}
/* 所有號碼格都是同尺寸正方形，不隨畫面拉伸 */
.rosterbox{display:flex;flex-direction:column;gap:4px;min-width:0}
.chips,.libs,.pad,.benchrow{display:grid;grid-template-columns:repeat(6,minmax(0,60px));gap:6px;justify-content:start}
.libs{align-items:center}
.sec{font-size:13px;font-weight:600;color:var(--muted)}
.sec.lib{margin-top:8px;color:var(--c)}
.chip{position:relative;aspect-ratio:1;min-height:0;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--s);color:var(--c);border-color:transparent;min-width:0}
.chip b{font-size:21px;line-height:1.1}
.chip small{position:absolute;left:2px;right:2px;bottom:1px;text-align:center;font-size:10px;line-height:1.2;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ul{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.chip.blank{background:transparent;border:1px dashed var(--line);color:var(--muted);cursor:default;font-size:14px;font-weight:600}
button.chip.blank{cursor:pointer}
.bench .chip[aria-pressed="true"]:not(.blank){outline:3px solid var(--ok)}
.chip.lib:not(.blank){background:var(--c);color:var(--o)}
.chip.lib:not(.blank) small{color:var(--o)}
.chip.editing{outline:3px solid var(--ink);outline-offset:1px}
.chip.blank.editing{background:var(--s);border-style:solid;color:var(--c)}
.chip.lib.blank:not(.editing)::after{content:"L";color:var(--muted);font-weight:600}
.hint{grid-column:1/-1;height:42px;display:flex;align-items:center;font-size:14px;color:var(--muted)}
.hint.err{color:var(--bad);font-weight:600}
.acts{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kp .acts button{height:40px;min-height:0;font-size:14px}
.kp .acts button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--o)}
.chip:disabled{opacity:1;cursor:default}
.chip.off:disabled{opacity:.35}
.chip[aria-pressed="true"]:not(.blank){outline:3px solid var(--c)}
.pad button{aspect-ratio:1;min-height:0;font-size:21px;padding:0}
.pad .add{background:var(--c);border-color:var(--c);color:var(--o);font-size:15px}
.colors{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.colors button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;padding:2px;font-size:12px}
.colors i{display:block;width:26px;height:26px;border-radius:6px;background:var(--j);border:1px solid var(--muted)}
.colors button[aria-pressed="true"]{outline:3px solid var(--ink)}
.pad .back{font-size:17px}
.bench .chip.t2{--c:var(--t2);--s:var(--t2-soft)}
.bench .chip.t1{--c:var(--t1);--s:var(--t1-soft)}
@media (min-width:760px){.split{flex-direction:row;gap:24px}}

/* 名單：比照紙本，兩隊並列、號碼＋姓名兩欄 */
.sheetgrid{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:2px solid var(--ink);border-radius:4px;background:var(--panel)}
.sheetgrid>*{min-width:0}
.rh.t1,.rr.t1,.ch.t1{border-right:2px solid var(--ink)}
.rh{--c:var(--t1);display:flex;gap:3px;align-items:center;padding:3px;border-bottom:1px solid var(--ink)}
.rh.t2{--c:var(--t2)}
.rh input{min-height:32px;height:32px;padding:0 4px;font-weight:700;color:var(--c);border:0;background:transparent;flex:1;min-width:0}
.rh .swatch{width:28px;height:28px;min-height:0;border-radius:4px;flex:none}
.ab{font-weight:700;color:var(--c);padding:0 3px}
.ch{display:grid;grid-template-columns:42px 1fr;font-size:12px;color:var(--muted);text-align:center;border-bottom:1px solid var(--ink)}
.rr{--c:var(--t1);--s:var(--t1-soft);display:grid;grid-template-columns:42px minmax(0,1fr);height:26px;border-bottom:1px solid var(--line)}
.rr.t2{--c:var(--t2);--s:var(--t2-soft)}
.num{min-height:0;height:100%;padding:0;border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;color:var(--c)}
.num b{font-size:16px;line-height:1}
.circ{display:inline-flex;align-items:center;justify-content:center;border:2px solid currentColor;border-radius:50%}
.num b.circ{width:23px;height:23px;font-size:13px}
.cell b.circ{width:60px;height:60px;border-width:3px;font-size:30px}
.chip b.circ{width:38px;height:38px;font-size:17px}
.mk{font-style:normal;font-weight:800;margin-right:5px;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:2px solid currentColor;border-radius:4px;font-size:13px}
.mk.c{border-radius:50%}
.rr.t1,.lusheet.t1,.bench .chip.t1{--j:var(--t1-j);--jt:var(--t1-jt)}
.rr.t2,.lusheet.t2,.bench .chip.t2{--j:var(--t2-j);--jt:var(--t2-jt)}
.num.on{background:var(--s);outline:3px solid var(--ok);outline-offset:-3px}
.num.fill,.cell.fill,.bench .chip{background:var(--j);color:var(--jt);border-color:var(--line)}
.num.fill{border-bottom:1px solid var(--line)}
.num:disabled{opacity:1;cursor:default}
.rr input{min-height:0;height:100%;padding:0 4px;border:0;border-radius:0;background:transparent;line-height:1}
.rr input:disabled{background:transparent;color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink)}
.band{grid-column:1/-1;text-align:center;font-size:12px;font-weight:700;padding:2px 0;border-bottom:1px solid var(--ink);border-top:1px solid var(--ink)}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;flex:none;margin-top:auto}
.tool{--c:var(--t1);--s:var(--t1-soft);--o:var(--t1-on);display:flex;flex-direction:column;gap:5px;min-width:0}
.tool.t2{--c:var(--t2);--s:var(--t2-soft);--o:var(--t2-on)}
.count{font-size:14px;font-weight:600;color:var(--c)}
.tool button{min-height:36px;font-size:14px;padding:0 4px}
.tool .good{padding:6px;text-align:center}
.tool .foot button{min-height:40px;font-size:14px;width:100%}
.page.kpopen{padding-bottom:230px}
.kp{--c:var(--t1);--s:var(--t1-soft);--o:var(--t1-on);position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:2px solid var(--ink);display:flex;flex-direction:column;gap:6px;align-items:center;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.kp.t2{--c:var(--t2);--s:var(--t2-soft);--o:var(--t2-on)}
.kp>*{width:100%;max-width:396px}
.kphead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.kphead button{min-height:36px;font-size:14px}
.kphead .err{color:var(--bad);font-weight:600}
.kp .subbody{min-height:84px;display:flex;flex-direction:column;gap:6px}
.kp .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kp .pad{justify-content:space-between}

/* 比賽：上比分、中球場、下得分鈕 */
.ptsum{display:flex;flex-direction:column;gap:1px}
.ptset{display:grid;grid-template-columns:auto 58px minmax(0,1fr) 58px;gap:6px;align-items:end}
.sw{display:flex;flex-direction:column;gap:3px;min-width:0}
.sw .seg button{font-size:14px;padding:0 2px;line-height:1.15}
.ptset strong{padding-bottom:12px}
.board{display:grid;grid-template-columns:minmax(0,1fr) 46px 88px 46px minmax(0,1fr);align-items:center;gap:4px;flex:none}
.ss{display:flex;flex-direction:column;align-items:center;min-width:0}
.ss.t1{--c:var(--t1)}.ss.t2{--c:var(--t2)}
.ss .tn{font-weight:700;color:var(--c);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss b{font-size:42px;line-height:1.05}
.mid{text-align:center;font-weight:700;font-size:14px}
.mid small{font-weight:500;color:var(--muted)}
.pcourt{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) 5px repeat(2,minmax(0,1fr));grid-auto-rows:52px;gap:3px;width:100%;max-width:400px;align-self:center}
.net{grid-column:3;grid-row:1/4;background:var(--ink);border-radius:2px}
.pc{position:relative;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--j);color:var(--jt);border:1px solid var(--line);padding:0;min-height:0}
.pc:disabled{opacity:1;cursor:default}

/*DESIGN-START*/
/* 視覺系統：取自記錄台。深藍是球場與版頭，黃色只給「往下走」的主要動作，紅色只給不可逆動作，數字用窄體像計分板。 */
/* iPhone 上下邊。主畫面 App 有兩種實機狀況：
   一、從狀態列後面開始畫（上 inset 62）：系統蓋模糊到約 100pt，網頁關不掉，內容要排到模糊下方；開機時 100dvh 少 62，要用 100lvh 才到螢幕底。
   二、從狀態列下方開始（上 inset 0）：沒有模糊，這時 100lvh 不準，要用 100dvh。下面的 min() 兩種都對。 */
:root{--safe-top:env(safe-area-inset-top,0px);--vgap:0px;--edge:linear-gradient(90deg,#2F7BD6 0 33.4%,#fff 33.4% 66.7%,#FFD21F 66.7%)}
.statusband{position:fixed;top:0;left:0;right:0;height:var(--safe-top);background:var(--brand);z-index:99;pointer-events:none;overflow:hidden}
.footband{display:none}
@media print{.statusband,.footband{display:none}}
html{touch-action:manipulation;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none}
button,label,.bar,.nav,.pc,.ss,.mid,.setbox{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{max-width:none;height:100vh;height:100dvh}
.shell.nonav .page{padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
@media (display-mode:standalone){
  :root{--safe-top:calc(env(safe-area-inset-top,0px) + min(40px,calc(env(safe-area-inset-top,0px)*99)))}
  html{background:var(--brand);color-scheme:dark}
  body{color-scheme:var(--cs,light)}
  .statusband{height:max(6px,var(--safe-top))}
  .statusband::after,.footband::before{content:"";position:absolute;left:0;right:0;height:3px;background:var(--edge)}
  .statusband::after{bottom:0}
  .footband::before{top:0}
}
@media (display-mode:standalone) and (orientation:portrait){
  .footband{display:block;position:fixed;left:0;right:0;bottom:calc(0px - var(--vgap));height:env(safe-area-inset-bottom,0px);background:var(--brand);z-index:99;pointer-events:none;overflow:hidden}
  .shell.nonav .page{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
  .fsin{padding:0 env(safe-area-inset-bottom,0px) 0 max(6px,var(--safe-top))}
}
@media (display-mode:standalone) and (orientation:landscape) and (max-height:500px){.statusband{display:none}}
@supports (height:100lvh){
  @media (display-mode:standalone){
    :root{--app-h:min(100lvh,calc(100dvh + env(safe-area-inset-top,0px)*99));--vgap:calc(var(--app-h) - 100dvh)}
    html,body,#app{height:var(--app-h)}
    html,body{overflow:visible}
    #app{overflow:hidden}
    .rv,.fsv,.help,.scrim,.sheet,.kp,.stale{bottom:calc(0px - var(--vgap))!important}
  }
  @media (display-mode:standalone) and (orientation:portrait){.fsin{width:var(--app-h)}}
}

  /* 復原：UNDO 事件指向被取消的事件，事件本身不刪，日後同步才對得起來 */
  var dead={};
  events.forEach(function(ev){if(ev.type==='UNDO')dead[ev.data.target]=1});
  var patch={},evPos={},swaps=[];
  s.log=[];s.amends=[];s.flipped={};s.scAfter={};
  events.forEach(function(ev,i){evPos[ev.id]=i});
  events.forEach(function(ev,i){
    if(ev.type!=='AMEND'||dead[ev.id])return;
    s.amends.push(ev.data.note);
    if(ev.data.ins)return; // 補記：下面照時間軸放進去
    if(ev.data.multi){ev.data.multi.forEach(function(q){patch[q.target]=Object.assign(patch[q.target]||{},q.patch)});return} // 11/13 改發球格：一次改好幾分
    if(ev.data.swap)swaps.push({set:ev.data.swap,from:evPos[ev.data.target],to:i}); // 左右寫反：這次更正之前的紀錄，隊伍對調
    if(ev.data.del)dead[ev.data.target]=1;
    else patch[ev.data.target]=Object.assign(patch[ev.data.target]||{},ev.data.patch);
  });
  /* 11/12 補記：AMEND 帶 ins 的，照時間軸放在 after 那一筆後面；這筆的 id 就是 AMEND 的 id，之後可以照樣更正、刪除、復原 */
  var insAt={},seq=[],stopped=false;
  events.forEach(function(ev){if(ev.type==='AMEND'&&!dead[ev.id]&&ev.data.ins){var q=ev.data.ins;(insAt[q.after]=insAt[q.after]||[]).push({id:ev.id,type:q.type,at:q.at||ev.at,data:q.data})}});
  events.forEach(function(ev){if(!dead[ev.id]&&ev.type!=='UNDO'&&ev.type!=='AMEND')seq.push(ev);if(insAt[ev.id])seq=seq.concat(insAt[ev.id])});
  seq.forEach(function(ev){
    if(stopped||(stopId&&ev.id===stopId)){stopped=true;return}
    var d=patch[ev.id]?Object.assign({},ev.data,patch[ev.id]):ev.data;
    if(swaps.length&&d.team&&swaps.filter(function(x){return x.set===d.set&&evPos[ev.id]>x.from&&evPos[ev.id]<x.to}).length%2){d=Object.assign({},d,{team:other(d.team)});s.flipped[ev.id]=1}
    var t=d.team?s.teams[d.team]:null,cs0=d&&d.set&&s.sets[d.set]?s.sets[d.set].score.t1+':'+s.sets[d.set].score.t2:'';
    switch(ev.type){
      case 'MATCH_CREATED': s.info=Object.assign({},d.info); break;
      case 'INFO_SET': s.info[d.field]=d.value; break;
      case 'TEAM_NAME_SET': t.name=d.value; break;
      case 'PLAYER_ADDED': t.players.push({no:d.no,name:''}); break;
      case 'PLAYER_NAME_SET': t.players.forEach(function(p){if(p.no===d.no)p.name=d.name}); break;
      case 'PLAYER_NUMBER_CHANGED':
        t.players.forEach(function(p){if(p.no===d.from)p.no=d.to});
        if(t.captain===d.from)t.captain=d.to;
        s.sets[1].lineups[d.team]=s.sets[1].lineups[d.team].map(function(n){return n===d.from?d.to:n});
        if(s.sets[1].gameCaptain[d.team]===d.from)s.sets[1].gameCaptain[d.team]=d.to;
        t.liberos=t.liberos.map(function(n){return n===d.from?d.to:n});
        break;
      case 'PLAYER_REMOVED':
        t.players=t.players.filter(function(p){return p.no!==d.no});
        dropFromLineup(s,d.team,d.no);
        if(t.captain===d.no)t.captain=null;
        t.liberos=t.liberos.filter(function(n){return n!==d.no});
        break;
      case 'CAPTAIN_SET': t.captain=d.no; break;
      case 'SETTER_SET': var stl=s.setters[d.team]=s.setters[d.team].filter(function(q){return q!==d.no}); if(d.on&&stl.length<2)stl.push(d.no); break; // 舉球員只是畫面標示，一隊最多兩位
      case 'LIBERO_SET':
        t.liberos=t.liberos.filter(function(n){return n!==d.no});
        if(d.on){t.liberos.push(d.no);dropFromLineup(s,d.team,d.no)}
        break;
      case 'STAFF_SET': t.staff[d.field]=d.value; break;
      case 'TEAM_COLOR_SET': t.color=d.color; break;
      case 'LIBERO_COLOR_SET': t.liberoColor=d.color; break;
      case 'TEAM_IMPORTED':
        var snap=JSON.parse(JSON.stringify(d.snapshot));
        snap.locked=false; s.teams[d.team]=snap;
        s.sets[1].lineups[d.team]=[null,null,null,null,null,null]; s.sets[1].locked[d.team]=false; s.sets[1].gameCaptain[d.team]=null;
        break;
      case 'TOSS_SET': var ss=s.sets[d.set]; if(d.left!==undefined)ss.left=d.left; if(d.serve!==undefined)ss.serve=d.serve; break;
      case 'LINEUP_SET':
        var lu=s.sets[d.set].lineups[d.team], was=lu.indexOf(d.no);
        if(d.no!==null&&was>=0)lu[was]=lu[d.pos];
        lu[d.pos]=d.no;
        break;
      case 'LINEUP_COPIED': s.sets[d.set].lineups[d.team]=s.sets[d.set-1].lineups[d.team].map(function(n){return s.matchOut[d.team].indexOf(n)<0?n:null}); break;
      case 'LINEUP_ROTATED':
        var lr=s.sets[d.set].lineups[d.team],st2=d.dir==='cw'?1:5;
        s.sets[d.set].lineups[d.team]=lr.map(function(_,i){return lr[(i+st2)%6]});
        break;
      case 'GAME_CAPTAIN_SET': s.sets[d.set].gameCaptain[d.team]=d.no; var co=s.teams[d.team].capOrder=(s.teams[d.team].capOrder||[]).slice(); if(d.no!=null&&co.indexOf(d.no)<0)co.push(d.no); break;
      case 'LINEUP_CORRECTED':
        var fc=s.sets[d.set],fl=fc.lineups[d.team],fa=fl[d.pos],fo2=fl.indexOf(d.no),fcur=fc.cur[d.team],flo=fc.libOut;
        var fix=function(i,a,b){if(fcur[i]===a)fcur[i]=b;if(flo[d.team]&&flo[d.team].idx===i&&flo[d.team].no===a)flo[d.team].no=b};
        fl[d.pos]=d.no;fix(d.pos,fa,d.no);
        if(fo2>=0){fl[fo2]=fa;fix(fo2,d.no,fa)}
        fc.tape.forEach(function(q){if(q.k!=='S'||q.team!==d.team)return;['in','out'].forEach(function(f){if(q[f]===fa)q[f]=d.no;else if(fo2>=0&&q[f]===d.no)q[f]=fa})});
        (s.corrections=s.corrections||[]).push({set:d.set,team:d.team,score:fc.score[d.team]+':'+fc.score[other(d.team)],pos:d.pos,from:fa,to:d.no,other:fo2});
        break;
      case 'LINEUP_LOCKED': s.sets[d.set].locked[d.team]=true; break;
      case 'LINEUP_UNLOCKED': s.sets[d.set].locked[d.team]=false; break;
      case 'SET_STARTED':
        var st=s.sets[d.set]; if(d.fixServe)st.serve=d.fixServe; if(d.fixLeft)st.left=d.fixLeft; if(swaps.filter(function(x){return x.set===d.set}).length%2){st.left=other(st.left);st.serve=other(st.serve);st.swapped=true} st.started=true; st.serving=st.serve; st.startAt=ev.at; st.firstServeAt=ev.at; st.cur={t1:st.lineups.t1.slice(),t2:st.lineups.t2.slice()};
        if(d.set===1){s.teams.t1.locked=true;s.teams.t2.locked=true}
        break;
      case 'POINT':
        applyPoint(s.sets[d.set],d.team); s.sets[d.set].lastPointAt=ev.at;
        break;
      case 'SANCTION':
        var sn=s.sets[d.set],ot=other(d.team);
        s.log.push({id:ev.id,set:d.set,kind:'J',team:d.team,san:d.kind,who:d.who,score:sn.score[d.team]+':'+sn.score[ot]});
        s.sanctions.push({set:d.set,team:d.team,kind:d.kind,who:d.who,score:sn.score[d.team]+':'+sn.score[ot]});
        if(d.kind==='DP'||d.kind==='P'){applyPoint(sn,ot);sn.penPts[ot].push(sn.score[ot]);sn.lastPointAt=ev.at;sn.tape[sn.tape.length-1].pen=true}
        if(d.kind==='E'&&typeof d.who==='number')sn.expelled[d.team].push(d.who);
        if(d.kind==='D'&&typeof d.who==='number')s.matchOut[d.team].push(d.who);
        break;
      case 'AC_COACH': var ac=s.sets[d.set]; s.acc=(s.acc||[]).concat([{id:ev.id,set:d.set,team:d.team,back:!!d.back,raw:{t1:ac.score.t1,t2:ac.score.t2}}]); break;
      case 'INJURY': var ij=s.sets[d.set]; s.injuries.push({team:d.team,no:d.no,set:d.set,raw:{t1:ij.score.t1,t2:ij.score.t2}}); break;
      case 'INCOMPLETE':
        var ic=s.sets[d.set],op=other(d.team);
        s.incomplete={team:d.team,scope:d.scope,set:d.set,raw:{t1:ic.score.t1,t2:ic.score.t2}};
        ic.score[op]=Math.max(target(s,d.set),ic.score[d.team]+2);
        ic.started=true; ic.ended=true; ic.winner=op; ic.endAt=ev.at; ic.live=false;
        if(d.scope==='match'){
          for(var mn=d.set+1;mn<=fmtOf(s)&&setsWon(s)[op]<needWins(s);mn++){var mc=s.sets[mn];mc.started=true;mc.ended=true;mc.winner=op;mc.score[op]=target(s,mn);mc.endAt=ev.at;mc.left=mc.left||ic.left;s.setNo=mn}
        }
        break;
      case 'PRE_FORFEIT':
        var pw=d.winner,pl2=other(pw);
        winList(s).forEach(function(mn){var mc=s.sets[mn];mc.left=mn%2?pw:pl2;mc.started=true;mc.ended=true;mc.winner=pw;mc.score[pw]=25});
        s.setNo=needWins(s);s.preForfeit={winner:pw,reason:d.reason};
        s.teams.t1.locked=true;s.teams.t2.locked=true;
        break;
      case 'FORFEIT':
        var fo=other(d.team),fc=s.sets[s.setNo];
        s.forfeitAt=fc&&fc.started&&!fc.ended?{set:s.setNo,raw:{t1:fc.score.t1,t2:fc.score.t2}}:s.sets[1].started?{set:fc&&fc.ended?s.setNo+1:s.setNo,before:true}:null;
        if(s.sets[1].started){ /* 打到一半棄權（11/7 使用者決定）：打完的局照實際比分；這一局比照陣容不完整，棄權隊保留分數；沒打的局對方拿該局的分數 */
          if(fc.started&&!fc.ended){fc.score[fo]=Math.max(target(s,s.setNo),fc.score[d.team]+2);fc.ended=true;fc.winner=fo;fc.endAt=ev.at;fc.live=false}
          for(var fn=1;fn<=setList(s).length&&!matchOver(s);fn++){var fm=s.sets[fn];if(fm.ended)continue;fm.score={t1:0,t2:0};fm.score[fo]=target(s,fn);fm.started=true;fm.ended=true;fm.winner=fo;fm.endAt=ev.at;fm.live=false;fm.left=fm.left||s.sets[fn-1].left;s.setNo=fn}
          s.forfeit=d.team;break;
        }
        setList(s).forEach(function(mn){var mc=s.sets[mn];mc.score={t1:0,t2:0};mc.ended=false;mc.winner=null;mc.started=false});
        winList(s).forEach(function(mn){var mc=s.sets[mn];mc.started=true;mc.ended=true;mc.winner=fo;mc.score[fo]=25;mc.endAt=ev.at;mc.left=mc.left||s.sets[1].left||'t1'});
        if(!s.sets[1].left)s.sets[1].left='t1';
        s.setNo=needWins(s);s.forfeit=d.team;
        break;
      case 'SERVE': s.sets[d.set].live=true; if(!s.sets[d.set].firstServeAt)s.sets[d.set].firstServeAt=ev.at; break;
      case 'REPLAY': s.sets[d.set].live=false; s.sets[d.set].replayLock=true; break;
      case 'TIMEOUT': var to=s.sets[d.set],tq=d.sc?d.sc[0]:to.score[d.team],tr=d.sc?d.sc[1]:to.score[other(d.team)]; s.log.push({id:ev.id,set:d.set,kind:'T',team:d.team,score:tq+':'+tr,scx:!!d.sc}); to.timeouts[d.team].push(d.team==='t1'?tq+':'+tr:tr+':'+tq); to.tape.push({k:'T',team:d.team,st:to.serving,si:to.rot[to.serving]}); to.toRows[d.team].push(tq+':'+tr); to.timeouts[d.team].sort(function(x,y){return scPos(to,'t1',x)-scPos(to,'t1',y)}); to.toRows[d.team].sort(function(x,y){return scPos(to,d.team,x)-scPos(to,d.team,y)}); break;
      case 'SUB':
        var sb=s.sets[d.set],ps=sb.subPos[d.team][d.idx];
        var so=d.sc?d.sc[0]:sb.score[d.team],sp=d.sc?d.sc[1]:sb.score[other(d.team)]; // 更正過的比分（本隊在前）
        s.log.push({id:ev.id,set:d.set,kind:'S',team:d.team,idx:d.idx,out:d.out,in:d.in,exc:!!d.exc,ret:!d.exc&&ps.sub!=null,score:so+':'+sp,scx:!!d.sc});
        if(!d.exc){var rq=sb.reqSubs||(sb.reqSubs={t1:[],t2:[]});if(sb.subRally[d.team]!==sb.rally)rq[d.team]=[];rq[d.team].push({id:ev.id,t:d.out+' 換 '+d.in});sb.subRally[d.team]=sb.rally}
        sb.cur[d.team][d.idx]=d.in;
        sb.subRows[d.team][d.idx].push({in:d.in,score:so+':'+sp,exc:!!d.exc});
        sb.subs[d.team].push({out:d.out,in:d.in,score:d.team==='t1'?so+':'+sp:sp+':'+so,exc:!!d.exc,injury:!!d.injury});
        if(d.exc)s.matchOut[d.team].push(d.out);
        else{sb.subCount[d.team]++; if(ps.sub==null)ps.sub=d.in}
        sb.tape.push({k:'S',team:d.team,st:sb.serving,si:sb.rot[sb.serving],in:d.in,out:d.out});
        break;
      case 'LIBERO_REDESIGNATED':
        var rt=s.teams[d.team],rs=s.sets[d.set];
        if(!rt.regLib)rt.regLib=rt.liberos.slice(); // 記錄表名單維持原本登錄的，換人只寫在記事欄
        rt.liberos=rt.liberos.filter(function(q){return q!==d.old});
        if(d.no!==null)rt.liberos.push(d.no);
        s.matchOut[d.team].push(d.old);
        (s.redes=s.redes||[]).push({set:d.set,team:d.team,old:d.old,no:d.no,raw:{t1:rs.score.t1,t2:rs.score.t2}});
        break;
      case 'LIBERO_IN': s.log.push({id:ev.id,set:d.set,kind:'L',team:d.team,idx:d.idx}); var li=s.sets[d.set]; li.libOut[d.team]={no:li.cur[d.team][d.idx],idx:d.idx}; li.libRows[d.team].push({lib:d.lib,rep:li.cur[d.team][d.idx],enter:'L',score:li.score[d.team]+':'+li.score[other(d.team)]}); li.cur[d.team][d.idx]=d.lib; li.libRally[d.team]=li.rally; break;
      case 'LIBERO_OUT': var lo=s.sets[d.set],b=lo.libOut[d.team]; lo.libRows[d.team].push({lib:lo.cur[d.team][b.idx],rep:b.no,enter:'R',score:lo.score[d.team]+':'+lo.score[other(d.team)]}); lo.cur[d.team][b.idx]=b.no; lo.libOut[d.team]=null; lo.libRally[d.team]=lo.rally; break;
      case 'LIBERO_SWAP': var ls=s.sets[d.set]; ls.libRows[d.team].push({lib:d.lib,rep:null,enter:'L',score:ls.score[d.team]+':'+ls.score[other(d.team)]}); ls.cur[d.team][ls.libOut[d.team].idx]=d.lib; ls.libRally[d.team]=ls.rally; break;
      case 'SIDES_SWAPPED': var sw=s.sets[d.set]; sw.swapAt=(sw.path||[]).length; sw.left=other(sw.left); sw.swapped=true; sw.swapScore=sw.score[sw.left]+':'+sw.score[other(sw.left)]; sw.swapSnap=JSON.parse(JSON.stringify({rounds:sw.rounds,subRows:sw.subRows,toRows:sw.toRows,score:sw.score,libN:{t1:sw.libRows.t1.length,t2:sw.libRows.t2.length}})); break;
      case 'SCORE_CANCEL': // 11/13 輪轉錯誤／非法替補：犯錯隊追回到 d.to 分（對方的 1 分照平常按得分），輪轉不倒回

  ['t1','t2'].forEach(function(k){var t=s.teams[k];t.entry=t.players.slice();t.players.sort(function(a,b){return a.no-b.no})});

}

/* 算不出來的比賽只影響那一場，不能讓整個程式打不開 */
function safeReduce(m){try{return reduce(m.events)}catch(e){return null}}
function current(){return db.matches.filter(function(m){return m.id===db.currentId})[0]||null}
function dispatch(type,data,match){
  var m=match||current();
  m.events.push({id:uid(),matchId:m.id,seq:m.events.length+1,at:new Date().toISOString(),device:DEVICE,type:type,data:data});
  save();
}
/* 開新比賽：選了資料夾就帶入這個資料夾上一場的組別、地點、場地；沒選就照上一場 */
function newMatchIn(cid){
  var c=db.cups.filter(function(x){return x.id===cid})[0],inf=defaultInfo();
  if(c){inf.name=c.name;var prev=db.matches.filter(function(q){return q.cup===c.id}).map(function(q){return safeReduce(q)}).filter(function(q){return q&&!q.info.sample})[0];
    ['division','group','place','court','city'].forEach(function(f){inf[f]=prev?(prev.info[f]||''):''})}
  var nm=createMatch(inf);if(c){nm.cup=c.id;save()}
  db.currentId=nm.id;save();resetUi();view='setup';
}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function createMatch(info){
  var m={id:uid(),createdAt:new Date().toISOString(),events:[]};
  db.matches.unshift(m);
  dispatch('MATCH_CREATED',{info:info},m);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  return m;
}
function defaultInfo(){
  var last={};db.matches.some(function(x){var q=safeReduce(x);if(!q||q.info.sample)return false;last=q.info;return true});
  return {name:last.name||'',division:last.division||'',group:last.group||'',game:'',date:today(),time:'',city:last.city||'',place:last.place||'',court:last.court||'',fmt:last.fmt||3,referee:last.referee||'',umpire:last.umpire||'',scorer:last.scorer||''};
}
/* 先前比賽的隊伍：不另外建隊伍庫，直接從歷次比賽抓，同隊名取最新一場 */
/* 同資料夾的隊伍優先，再來才是先前比賽的隊伍 */
function teamChoices(m){
  var out=[],seen={},cup=db.cups.filter(function(c){return c.id===m.cup})[0];
  if(cup){var ms=safeReduce(m),dv=ms?ms.info.division:'';cup.teams.slice().sort(function(a,b){return (b.division===dv)-(a.division===dv)}).forEach(function(x){var n=x.team.name.trim();if(n&&!seen[n]){seen[n]=1;out.push({name:n,team:x.team,date:'',division:x.division||'',group:x.group||''})}})}
  pastTeams(m.id).forEach(function(p){if(!seen[p.name])out.push(p)});

function fitNums(){
  var bs=app.querySelectorAll('.pcourt .pc b'),sz=[];
  for(var i=0;i<bs.length;i++){bs[i].style.fontSize='';bs[i].parentNode.style.removeProperty('--k')}
  for(i=0;i<bs.length;i++){var c=bs[i].parentNode;sz.push([c.clientWidth,c.clientHeight,parseFloat(getComputedStyle(bs[i]).fontSize)])}
  for(i=0;i<bs.length;i++){var w=sz[i][0],h=sz[i][1];if(!w||!h)continue;var want=Math.min(NUM_R*Math.min(w,h),NUM_MAX);
    if(want>sz[i][2]+1){bs[i].style.fontSize=Math.round(want)+'px';bs[i].parentNode.style.setProperty('--k',Math.min(want/sz[i][2],1.7).toFixed(2))}}

     再量一次，碰到號碼（隊長圈照圓形算）就再縮，最小 11px。平板、電腦格子大，維持原本大小 */
  var ps=app.querySelectorAll('.pcourt .pc .pos');

  for(i=0;i<ps.length;i++){var p=ps[i],cl=p.parentNode,nb=cl.querySelector('b');if(!cl.clientWidth||!cl.clientHeight)continue;

      if(circ){var qx=Math.max(L2,Math.min(cx,R2)),qy=Math.max(T2,Math.min(cy,B2));hit=(qx-cx)*(qx-cx)+(qy-cy)*(qy-cy)<rad*rad}

s、Mac、Chromebook、LINE","cards":[{"img":"ins_pc","t":"Windows、Chromebook","d":"用 Chrome 或 Edge 開網站，按網址列右邊的安裝圖示，就會變成應用程式。Mac 的 Chrome 也一樣。"},{"img":"ins_mac","t":"Mac 的 Safari","d":"用 Safari 開網站，按上方選單的「檔案」，再按「加入 Dock」。"},{"img":"ins_line","t":"從 LINE 打開時","d":"LINE 裡面可能不能離線和備份。按主畫面提醒的「用 Safari 開啟」或複製網址，改用瀏覽器。"},{"img":"ins_bk","t":"舊資料怎麼帶過去","d":"瀏覽器和主畫面的資料是分開的。先在原本的地方到「紀錄與名單」按「選擇」、「全選」再按「備份」，到新的地方匯入。"}]}];
function helpCards(){var g=HELP.filter(function(x){return x.id===ui.help.group})[0]||HELP[0];return g.cards.map(function(c){return {img:c.img,t:c.t,d:c.d,g:g.name}})}
/* 11/13 使用教學最上面：有還沒打完的練習時，選「繼續上次的練習」或「重新開一場練習」 */
function smpBtns(){
  var sm=db.matches.map(function(x){return {m:x,s:safeReduce(x)}}).filter(function(q){return q.s&&q.s.info.sample&&!matchOver(q.s)})[0];
  if(!sm)return '<button class="hsample" data-act="sample"><strong>用範例比賽試試</strong><small>名單已經填好，可以放心亂按，標示「練習」，不會混進正式紀錄</small></button>';
  return '<button class="hsample" data-act="sample"><strong>繼續上次的練習</strong><small>'+(sm.s.sets[1].started?'打到第 '+sm.s.setNo+' 局，接著練':'還沒開賽，接著準備')+'</small></button><button class="hsample" data-act="smpnew"><strong>重新開一場練習</strong><small>上次的練習會清掉</small></button>';
}
function helpHtml(){
  if(!ui.help)return '';
  if(!ui.help.group)return '<div class="help menu" role="dialog" aria-modal="true" aria-label="使用教學"><div class="hhead"><h1>使用教學</h1><button data-act="helpclose" aria-label="關閉說明">✕</button></div><div class="hmenu">'+(view==='home'?smpBtns():'')+HELP.map(function(g){return '<button data-act="helpgroup" data-v="'+g.id+'"><strong>'+esc(g.name)+'</strong><small>'+esc(g.desc)+'</small></button>'}).join('')+'</div></div>';
  var cs=helpCards(),i=Math.min(ui.help.i,cs.length-1),last=i===cs.length-1;
  var dots=cs.map(function(_,n){return '<i'+(n===i?' class="on"':'')+'></i>'}).join('');
  var slides=cs.map(function(x,n){var src='../help/'+x.img+'.webp';return '<section class="hslide"'+(n===i?'':' aria-hidden="true"')+'><div class="himg">'+(src?'<img src="'+src+'" alt="" decoding="async">':'')+'</div><div class="htxt"><h2>'+esc(x.t)+'</h2><p>'+esc(x.d)+'</p></div></section>'}).join('');
  return '<div class="help" role="dialog" aria-modal="true" aria-label="使用說明"><div class="hhead"><button class="hback" data-act="helpmenu">‹ 目錄</button><span>'+esc(cs[0].g)+'</span><button data-act="helpclose" aria-label="關閉說明">✕</button></div><div class="htrack" id="htrack">'+slides+'</div><div class="hfoot"><div class="hdots">'+dots+'</div><div class="row hnav"><button id="hprev" data-act="helpgo" data-v="-1"'+(i===0?' disabled':'')+'>上一張</button><button class="go" id="hnext" data-act="'+(last?'helpclose':'helpgo')+'" data-v="1">'+(last?'看完了':'下一張')+'</button></div></div></div>';
}
/* 手指滑動交給瀏覽器（跟手、慣性、停在整張），這裡只同步目前第幾張 */
var helpBusy=0;
function helpPaint(){
  var t=document.getElementById('htrack');if(!t||!ui.help)return;
  var n=t.children.length,i=ui.help.i;
  [].forEach.call(t.children,function(e,k){if(k===i)e.removeAttribute('aria-hidden');else e.setAttribute('aria-hidden','true')});
  [].forEach.call(app.querySelectorAll('.hdots i'),function(e,k){e.className=k===i?'on':''});
  var p=document.getElementById('hprev'),x=document.getElementById('hnext'),end=i===n-1;
  if(p)p.disabled=i===0;
  if(x){x.setAttribute('data-act',end?'helpclose':'helpgo');x.textContent=end?'看完了':'下一張'}
}
function helpPlace(){var t=document.getElementById('htrack');if(t&&ui.help){var e=t.children[ui.help.i];if(e)t.scrollLeft=e.offsetLeft}}
function helpSync(t){
  var a=t.children[0],b=t.children[1],step=a&&b?b.offsetLeft-a.offsetLeft:t.clientWidth;if(!step||!ui.help)return;
  var i=Math.round(t.scrollLeft/step);if(i!==ui.help.i&&i>=0&&i<t.children.length){ui.help.i=i;helpPaint()}
}
function helpTo(i){
  var t=document.getElementById('htrack');if(!t||!ui.help)return;
  i=Math.max(0,Math.min(i,t.children.length-1));if(i===ui.help.i)return;
  ui.help.i=i;helpPaint();helpBusy=Date.now()+600;
  var x=t.children[i].offsetLeft;
  if(t.scrollTo)t.scrollTo({left:x,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});else t.scrollLeft=x;
  setTimeout(function(){if(t.isConnected)helpSync(t)},640);
}
document.addEventListener('scroll',function(e){if(e.target&&e.target.id==='htrack'&&Date.now()>=helpBusy)helpSync(e.target)},true);
document.addEventListener('keydown',function(e){
  if(!ui.help||!ui.help.group||(e.key!=='ArrowRight'&&e.key!=='ArrowLeft'))return;
  e.preventDefault();helpTo(ui.help.i+(e.key==='ArrowRight'?1:-1));
});
addEventListener('resize',helpPlace);
/* 橫的畫面：結果、判罰、記事欄這類表格依可用空間等比例放大，不留大片空白 */
function fitPaper(){
  var el=document.querySelector('.page>.ppr,.page>.ctv-res,.page>.ctv-pen');if(!el)return;
  el.style.zoom='';if(!isWide())return;
  var pg=el.parentNode,ft=pg.querySelector('.sheetfoot'),r=el.getBoundingClientRect(),pr=pg.getBoundingClientRect();
  var bottom=ft?ft.getBoundingClientRect().top-12:pr.bottom-12,f=Math.min((pr.width-24)/r.width,(bottom-r.top)/r.height,2.2);
  if(f>1.05)el.style.zoom=f.toFixed(3);

/* 11/13 最近刪除：刪除的比賽先移到 db.trash（帶刪除時間），30 天內可以救回；練習比賽直接清掉 */
function trashMatches(ids){
  var at=new Date().toISOString();
  db.matches=db.matches.filter(function(m){if(ids.indexOf(m.id)<0)return true;var r=safeReduce(m);if(!(r&&r.info.sample)){m.deletedAt=at;db.trash.unshift(m)}return false});
  if(db.currentId&&ids.indexOf(db.currentId)>=0)db.currentId=null;
}
function restoreMatch(id){
  var m=db.trash.filter(function(x){return x.id===id})[0];if(!m)return false;
  db.trash=db.trash.filter(function(x){return x!==m});delete m.deletedAt;
  if(db.matches.some(function(x){return x.id===id}))return true; // 同一場已經在（例如又匯入了），不重複放
  var i=0,ca=String(m.createdAt||'');while(i<db.matches.length&&String(db.matches[i].createdAt||'')>ca)i++;
  db.matches.splice(i,0,m);return true;
}

      '<div class="tbtns"><button data-act="trashback" data-id="'+esc(m.id)+'">救回</button><button data-act="trashask" data-id="'+esc(m.id)+'">永久刪除</button></div></div>'}).join('');
  var all=ui.trashAsk==='*'?'<div class="rrow ask"><span>把最近刪除的 '+db.trash.length+' 場全部永久刪除？刪了就救不回來。</span><div class="row"><button data-act="trashno">取消</button><button class="danger" data-act="trashall">全部永久刪除</button></div></div>'

/* 11/12 補記：第 n 局 own:opp（k 隊在前）那個比分之後、下一次發球之前，最後一筆原本的紀錄；補的放在它後面 */

/* 文字欄位改完只更新狀態，不重畫整頁，避免手指同時按下的按鈕被換掉 */
function refreshStatus(){
  var m=current(); if(!m)return;
  var s=reduce(m.events);
  var rs=document.getElementById('nav-rstat');if(rs)rs.outerHTML=rosterStat(s);
  var rn=document.getElementById('rnext');if(rn)rn.innerHTML=rosterNext(s);
  ['t1','t2'].forEach(function(k){
    var a=document.getElementById('nav-'+k),c=document.getElementById('foot-'+k);
    if(a)a.textContent=tName(s,k);
    if(c)c.innerHTML=footHtml(k,s.teams[k],s);
  });

  }else{
    dispatch('PLAYER_ADDED',{team:k,no:n});
    if(sl.kind==='lib')dispatch('LIBERO_SET',{team:k,no:n,on:true});
  }
  ui.entry[k]=''; ui.msg[k]='';
  ui.slot[k]=(old===null&&sl.kind==='reg')?autoSlot(reduce(current().events).teams[k]):null;
  return true;
}

/* 鍵盤：Esc 關閉最上層，Tab 留在面板內，名單可以直接打數字 */
function escClose(){
  var q=['.sheet [data-act=impcancel]','.help [data-act=helpclose]','.fsv [data-act=fsclose]','.whv [data-act=wholeclose]','[data-act=tono]','[data-act=cs-no]','[data-act=nclose]','[data-act=penno]','[data-act=incno]','[data-act=ffno]','.sheet [data-act=penback]','.sheet [data-act=pmback]','.sheet [data-act=scback]','.sheet [data-act=sheetback]','.sheet [data-act=penclose]','.sheet [data-act=amendback]','.sheet [data-act=fixback]','.sheet [data-act=import-cancel]','.sheet [data-act=aboutclose]','.sheet [data-act=rotback]','.sheet [data-act=bxback]','.sheet [data-act=srback]','.sheet [data-act=srno]','.sheet [data-act=close]','[data-act=subclose]','.lc.sel','[data-act=kpclose]','[data-act=del-no]','[data-act=trashno]','[data-act=bkcancel]','[data-act=tmclose]'];
  for(var i=0;i<q.length;i++){var e=app.querySelector(q[i]);if(e){e.click();return true}}
  return false;
}
document.addEventListener('keydown',function(e){
  if(e.isComposing||e.keyCode===229)return;
  if(e.key==='Tab'||e.key==='Enter'||e.key===' ')kbd=true;
  if(e.key==='Escape'){if(escClose())e.preventDefault();return}
  if(e.key==='Tab'){
    var t=topLayer();if(!t)return;
    var f=focusList(t);if(!f.length)return;
    var i=f.indexOf(document.activeElement),n=e.shiftKey?(i<=0?f.length-1:i-1):(i<0||i===f.length-1?0:i+1);
    f[n].focus();e.preventDefault();return;
  }
  var tg=e.target;
  if(e.key==='Enter'&&(tg.id==='ins0'||tg.id==='ins1')){e.preventDefault();var isb=app.querySelector('[data-act=insgo]');if(isb)isb.click();return}
  if(e.key==='Enter'&&(tg.id==='amsc0'||tg.id==='amsc1')){e.preventDefault();var asb=app.querySelector('[data-act=amendscore]');if(asb)asb.click();return}
  if(e.key==='Enter'&&tg.id==='ref-type'){e.preventDefault();var rtb=app.querySelector('[data-act=reftype]');if(rtb)rtb.click();return}
  if(/^(INPUT|TEXTAREA)$/.test(tg.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
  if(!app.querySelector('.kp [data-act=key]'))return;
  var b=/^[0-9]$/.test(e.key)?app.querySelector('.kp [data-act=key][data-v="'+e.key+'"]'):e.key==='Backspace'?app.querySelector('.kp [data-act=back]'):(e.key==='Enter'&&!tg.closest('.kp'))?app.querySelector('.kp [data-act=add]'):null;
  if(b){b.click();e.preventDefault()}
});
document.addEventListener('pointerdown',function(){kbd=false},true);

/* 別的分頁改過存檔：這個分頁正在記的比賽被動到就停用，沒被動到就把別場的新資料接過來 */
function syncTabs(){
  if(staleTab)return;
  var raw;try{raw=localStorage.getItem(KEY)}catch(e){return}
  if(raw===lastRaw)return;
  if(raw===null){lastRaw=null;return}
  var other=null;try{other=JSON.parse(raw)}catch(e){}
  var mine=current();
  if(!other||!Array.isArray(other.matches)){staleTab=true;render();return}
  if(mine){
    var oc=other.matches.filter(function(x){return x.id===mine.id})[0],n=mine.events.length;
    if(!oc||oc.events.length!==n||(n&&oc.events[n-1].id!==mine.events[n-1].id)){staleTab=true;render();return}
  }
  other.currentId=db.currentId;db=other;lastRaw=raw;
  if(view==='home'||view==='history')render();
}
addEventListener('storage',function(e){if(e.key===KEY||e.key===null)syncTabs()});
addEventListener('pageshow',function(e){if(e.persisted)syncTabs()});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')syncTabs()});

/* 11/11 按「更新」重新載入後回到原本的畫面（比賽中本來就會回到比賽） */
(function(){
  var b=null;try{b=JSON.parse(sessionStorage.getItem(KEY+'-back')||'null');sessionStorage.removeItem(KEY+'-back')}catch(e){}
  if(!b||!(Date.now()-(b.at||0)<120000))return;
  if(b.view==='history'){view='history';return}
  if(b.view==='cup'&&db.cups.some(function(c){return c.id===b.cup})){cupView={id:b.cup,div:CUP_DIVS.indexOf(b.div)>=0?b.div:CUP_DIVS[0],grp:''};view='cup';return}
  if(b.view==='setup'){var m=current(),st=m?safeReduce(m):null;if(!st)return;view='setup';ui.from=b.from||null;
    ui.page=(st.sets[1].started&&!matchOver(st))||['info','refs','roster','toss','lineup','play'].indexOf(b.page)<0?firstPage(st):b.page}
})();
updStart();
render();
})();
